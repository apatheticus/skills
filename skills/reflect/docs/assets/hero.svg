<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">reflect — a Claude Code reflection skill</title>
  <desc id="desc">The reflect skill reads your past Claude Code session transcripts and produces one interactive HTML report that ranks the highest-leverage changes to your setup. The right panel shows a report card titled "cc-reflection.html" with four descending leverage bars, fed by a cloud of session dots on the left.</desc>

  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11d3a3"/>
      <stop offset="0.55" stop-color="#12b5c9"/>
      <stop offset="1" stop-color="#28c8e8"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11d3a3" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#12b5c9" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#0d1320" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11d3a3"/>
      <stop offset="1" stop-color="#28c8e8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="360" rx="26" fill="#0d1320"/>
  <rect width="1200" height="360" rx="26" fill="url(#wash)"/>

  <!-- signal cloud: many sessions converging toward the report card -->
  <g fill="none" stroke="#2c3d57" stroke-width="1.2" opacity="0.7">
    <path d="M602 118 C 660 150, 672 176, 700 188"/>
    <path d="M588 168 C 648 176, 668 184, 700 190"/>
    <path d="M598 232 C 660 214, 676 200, 700 194"/>
    <path d="M636 96  C 672 140, 682 172, 700 187"/>
    <path d="M628 258 C 668 226, 682 204, 700 195"/>
  </g>
  <g>
    <circle cx="602" cy="118" r="4.5" fill="#6cf0cf"/>
    <circle cx="588" cy="168" r="4" fill="#4a5f81"/>
    <circle cx="598" cy="232" r="4.5" fill="#28c8e8"/>
    <circle cx="636" cy="96"  r="3.5" fill="#4a5f81"/>
    <circle cx="628" cy="258" r="4" fill="#4a5f81"/>
    <circle cx="566" cy="140" r="3" fill="#3c4f6d"/>
    <circle cx="572" cy="205" r="3" fill="#3c4f6d"/>
    <circle cx="614" cy="150" r="3" fill="#3c4f6d"/>
    <circle cx="612" cy="200" r="3" fill="#3c4f6d"/>
    <circle cx="650" cy="128" r="3" fill="#3c4f6d"/>
    <circle cx="652" cy="228" r="3" fill="#3c4f6d"/>
  </g>

  <!-- LEFT: title block -->
  <g transform="translate(64 0)">
    <text x="2" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="17" font-weight="600" letter-spacing="3.4" fill="#6cf0cf">REFLECTION SKILL · CLAUDE CODE</text>

    <text x="-4" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="116" font-weight="800" letter-spacing="-3" fill="#f4f7fb">reflect</text>

    <rect x="4" y="220" width="286" height="6" rx="3" fill="url(#ruleGrad)"/>

    <text x="4" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="23" font-weight="500" fill="#c2cdde">Turn your session history into a ranked,</text>
    <text x="4" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="23" font-weight="500" fill="#c2cdde">evidence-backed diagnosis of your setup.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <rect x="4" y="322" width="248" height="26" rx="13" fill="#141d2e" stroke="#26344c"/>
      <text x="19" y="339" fill="#8fa0b8">reads ~/.claude/projects</text>
      <rect x="264" y="322" width="204" height="26" rx="13" fill="#141d2e" stroke="#26344c"/>
      <text x="279" y="339" fill="#8fa0b8">one HTML report out</text>
    </g>
  </g>

  <!-- RIGHT: the produced report card -->
  <g transform="translate(700 62)">
    <rect x="0" y="0" width="436" height="236" rx="22" fill="#121a29" stroke="#26344c" stroke-width="1.5"/>

    <!-- window chrome -->
    <circle cx="26" cy="30" r="5" fill="#fb6b6b"/>
    <circle cx="44" cy="30" r="5" fill="#f5a623"/>
    <circle cx="62" cy="30" r="5" fill="#2fc97a"/>
    <text x="82" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#8fa0b8">cc-reflection.html</text>

    <line x1="16" y1="52" x2="420" y2="52" stroke="#26344c" stroke-width="1"/>

    <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="600" letter-spacing="1.6" fill="#7f90a8">TOP FINDINGS BY LEVERAGE</text>

    <!-- ranked leverage bars, verdict dot at left -->
    <g>
      <circle cx="32" cy="108" r="5" fill="#6cf0cf"/>
      <rect x="48" y="100" width="358" height="16" rx="8" fill="url(#barGrad)"/>

      <circle cx="32" cy="140" r="5" fill="#28c8e8"/>
      <rect x="48" y="132" width="312" height="16" rx="8" fill="url(#barGrad)" opacity="0.9"/>

      <circle cx="32" cy="172" r="5" fill="#f5a623"/>
      <rect x="48" y="164" width="256" height="16" rx="8" fill="url(#barGrad)" opacity="0.78"/>

      <circle cx="32" cy="204" r="5" fill="#8fe06a"/>
      <rect x="48" y="196" width="188" height="16" rx="8" fill="url(#barGrad)" opacity="0.66"/>
    </g>
  </g>
</svg>
