<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"
     role="img" data-loop-s="12" data-bg="background">
  <title>reflect — the six phases, numbered 0 to 5</title>
  <desc>Six raised cards, read left to right and top to bottom, each lit in turn. Phase 0
scopes the corpus: enumerate the in-window transcripts and load the prior report so this run
can be diffed against it. Phase 1 is the insights gate, and it gates on recency rather than
coverage, because /insights samples a few hundred recent sessions instead of the whole
corpus. Phase 2 triages, scoring every session from cheap metadata before any agent is
spent. Phase 3 extracts: fan out over batched transcripts, cluster the signals, decide a
verdict per cluster, then corroborate against the /insights data. Phase 4 renders one
self-contained HTML file with inline SVG and no external requests. Phase 5 delivers that
file with a summary of the top findings and anything the run had to skip. Nothing leaves the
machine, and nothing is built — recommending the change is the deliverable.</desc>

  <style>
    svg { --background:#E6E9EF; --surface:#E6E9EF;
          --ink:#2B303B; --muted:#5B6472; --accent-primary:#11D3A3;
          --nm-light:#FFFFFF; --nm-dark:#C3CAD6; }

    .bg     { fill: var(--background); }
    .raised { fill: var(--surface); filter: url(#raise); }

    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

    .kick { fill: var(--muted); font-size: 17px; font-weight: 600; letter-spacing: 2.4px; }
    .h    { fill: var(--ink);   font-size: 40px; font-weight: 700; letter-spacing: -0.8px; }
    .lede { fill: var(--muted); font-size: 22px; font-weight: 400; }

    .ph   { fill: var(--muted); font-size: 18px; font-weight: 600; letter-spacing: 1.2px; }
    .ct   { fill: var(--ink);   font-size: 24px; font-weight: 700; }
    .cs   { fill: var(--muted); font-size: 17px; font-weight: 600; }

    .mark { fill: var(--accent-primary); }

    /* One marker lights at a time and the march wraps, so the pass reads as a pass
       that repeats. One 12s animation, phase-shifted 2s per card. */
    .lift { opacity: 1; animation: lift 12s cubic-bezier(.4,0,.4,1) infinite; }
    @keyframes lift { 0%,18% { opacity: .4 } 24%,34% { opacity: 1 } 40%,100% { opacity: .4 } }
    .p0 { animation-delay: 0s }
    .p1 { animation-delay: -10s }
    .p2 { animation-delay: -8s }
    .p3 { animation-delay: -6s }
    .p4 { animation-delay: -4s }
    .p5 { animation-delay: -2s }

    @media (prefers-reduced-motion: reduce) {
      .lift { animation: none; opacity: 1 }
    }
  </style>

  <defs>
    <filter id="raise" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="7"  dy="7"  stdDeviation="9" flood-color="#C3CAD6" flood-opacity=".9"/>
      <feDropShadow dx="-7" dy="-7" stdDeviation="9" flood-color="#FFFFFF" flood-opacity=".9"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="620"/>

  <text class="sans kick" x="64" y="76" data-role="metadata">PHASES 0 – 5 · ONE PASS</text>
  <text class="sans h"    x="64" y="128" data-role="title">Six phases, one file out</text>
  <text class="sans lede" x="64" y="170" data-role="essential">Nothing leaves the machine, and nothing is built — recommending is the deliverable.</text>

  <rect class="raised" x="64" y="232" width="340" height="150" rx="24"/>
  <circle class="mark lift p0" cx="374" cy="270" r="11"/>
  <text class="mono ph" x="88" y="276" data-role="label">phase 0</text>
  <text class="sans ct" x="88" y="314">Scope the corpus</text>
  <text class="sans cs" x="88" y="344" data-role="metadata">enumerate in-window transcripts</text>
  <text class="sans cs" x="88" y="368" data-role="metadata">load the prior report to trend</text>

  <rect class="raised" x="430" y="232" width="340" height="150" rx="24"/>
  <circle class="mark lift p1" cx="740" cy="270" r="11"/>
  <text class="mono ph" x="454" y="276" data-role="label">phase 1</text>
  <text class="sans ct" x="454" y="314">Insights gate</text>
  <text class="sans cs" x="454" y="344" data-role="metadata">gate on recency, not coverage</text>
  <text class="sans cs" x="454" y="368" data-role="metadata">/insights samples the corpus</text>

  <rect class="raised" x="796" y="232" width="340" height="150" rx="24"/>
  <circle class="mark lift p2" cx="1106" cy="270" r="11"/>
  <text class="mono ph" x="820" y="276" data-role="label">phase 2</text>
  <text class="sans ct" x="820" y="314">Triage</text>
  <text class="sans cs" x="820" y="344" data-role="metadata">score every session from cheap</text>
  <text class="sans cs" x="820" y="368" data-role="metadata">metadata, before any agent runs</text>

  <rect class="raised" x="64" y="418" width="340" height="150" rx="24"/>
  <circle class="mark lift p3" cx="374" cy="456" r="11"/>
  <text class="mono ph" x="88" y="462" data-role="label">phase 3</text>
  <text class="sans ct" x="88" y="500">Extraction</text>
  <text class="sans cs" x="88" y="530" data-role="metadata">fan out, cluster, decide, then</text>
  <text class="sans cs" x="88" y="554" data-role="metadata">corroborate with /insights data</text>

  <rect class="raised" x="430" y="418" width="340" height="150" rx="24"/>
  <circle class="mark lift p4" cx="740" cy="456" r="11"/>
  <text class="mono ph" x="454" y="462" data-role="label">phase 4</text>
  <text class="sans ct" x="454" y="500">Report</text>
  <text class="sans cs" x="454" y="530" data-role="metadata">one self-contained HTML file,</text>
  <text class="sans cs" x="454" y="554" data-role="metadata">inline SVG, no external requests</text>

  <rect class="raised" x="796" y="418" width="340" height="150" rx="24"/>
  <circle class="mark lift p5" cx="1106" cy="456" r="11"/>
  <text class="mono ph" x="820" y="462" data-role="label">phase 5</text>
  <text class="sans ct" x="820" y="500">Deliver</text>
  <text class="sans cs" x="820" y="530" data-role="metadata">the file, a TL;DR of the top</text>
  <text class="sans cs" x="820" y="554" data-role="metadata">findings, and anything skipped</text>
</svg>
