<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740"
     role="img" data-loop-s="12" data-bg="background">
  <title>human-voice — which patterns run in which register</title>
  <desc>A printed plate setting the register gate table. A rust proof rule draws itself
across the head above the kicker, step three, pattern gates; the folio reads plate two.
The standfirst says that of the 33 catalogued patterns, 22 apply in every register and
never conflict with a house style, that these eleven do not, and that applying them blind
is how a register-aware skill breaks documents. Below, twelve rows are set in two stacks
divided by a vertical hairline, each row a pattern and each of four columns a register —
editorial, professional, technical, regulated. The em dash ban, signposting and
diff-anchored writing are on almost everywhere; inline-header lists, title-case headings,
hyphenated pairs and aphorism formulas switch off in technical and regulated; manufactured
punchlines, rhetorical openers and voice injection are editorial-only, on in editorial and
off in the other three. Emojis are limited in editorial and on elsewhere; excessive hedging
is limited in technical and regulated, because calibrated uncertainty there is content
rather than hedging; diff-anchored writing is elevated in technical, marked by the one
ringed rust mark on the plate. A key sets the four states — on, limited, elevated, off —
and a closing line notes that a pattern with no tag for the selected register is off.</desc>

  <style>
    svg { --background:#fbf9f4; --ink:#1a1a18; --muted:#6b6862;
          --accent:#8c2f1f; --rule:#d8d3c8; --keyline:#8f8a7e; }

    .bg   { fill: var(--background); }

    .kick  { fill: var(--muted); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 18px; font-weight: 600; letter-spacing: 2.6px; }
    .folio { fill: var(--muted); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 16px; font-weight: 600; letter-spacing: 2.2px; }
    .sect  { fill: var(--muted); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 16px; font-weight: 600; letter-spacing: 2.2px; }
    .colh  { fill: var(--muted); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 16px; font-weight: 600; letter-spacing: 1.4px; }

    .h     { fill: var(--ink); font-family: Georgia, 'Iowan Old Style', serif;
             font-size: 64px; font-weight: 700; letter-spacing: -1.5px; }
    .lede  { fill: var(--ink); font-family: Georgia, 'Iowan Old Style', serif;
             font-size: 28px; font-weight: 400; }
    .row   { fill: var(--ink); font-family: Georgia, 'Iowan Old Style', serif;
             font-size: 20px; font-weight: 400; }
    .leg   { fill: var(--muted); font-family: Georgia, 'Iowan Old Style', serif;
             font-size: 19px; font-weight: 400; }
    .sub   { fill: var(--muted); font-family: Georgia, 'Iowan Old Style', serif;
             font-size: 17px; font-weight: 400; }

    .hair  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .m-on       { fill: var(--ink); }
    .m-ring     { fill: none; stroke: var(--ink); stroke-width: 1.5; }
    .m-off      { fill: none; stroke: var(--keyline); stroke-width: 1.5; }
    .m-elev     { fill: var(--accent); }
    .m-elevring { fill: none; stroke: var(--accent); stroke-width: 1.5; }

    /* one motion on a plate of a hundred marks, and slow: the proof rule enters,
       holds, and leaves the other side, so t=0 and t=12 are both "no rule
       visible". 6s divides the 12s loop twice. */
    .draw { fill: none; stroke: var(--accent); stroke-width: 3;
            stroke-dasharray: 1040; animation: draw 6s ease-in-out infinite; }
    @keyframes draw {
      0%      { stroke-dashoffset: 1040 }
      45%,55% { stroke-dashoffset: 0 }
      100%    { stroke-dashoffset: -1040 }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="740"/>
  <line class="draw" x1="80" y1="72" x2="1120" y2="72"/>
  <text class="kick"  x="80" y="120">STEP THREE · PATTERN GATES</text>
  <text class="h"     x="80" y="188" data-role="title">Which patterns run</text>
  <text class="folio" x="1120" y="188" text-anchor="end" data-role="metadata">PLATE II</text>
  <line class="hair"  x1="80" y1="218" x2="1120" y2="218"/>
  <text class="lede" x="80" y="262">Of the 33 catalogued patterns, 22 apply in every register. These</text>
  <text class="lede" x="80" y="298">eleven do not — applying them blind is how this skill breaks documents.</text>
  <text class="sect" x="80" y="346" data-role="metadata">II · THE REGISTER-GATED ELEVEN, AND VOICE INJECTION</text>
  <line class="hair" x1="600" y1="376" x2="600" y2="614"/>
  <text class="colh" x="400" y="384" text-anchor="middle" data-role="metadata">ED</text>
  <text class="colh" x="446" y="384" text-anchor="middle" data-role="metadata">PRO</text>
  <text class="colh" x="492" y="384" text-anchor="middle" data-role="metadata">TEC</text>
  <text class="colh" x="538" y="384" text-anchor="middle" data-role="metadata">REG</text>
  <text class="colh" x="940" y="384" text-anchor="middle" data-role="metadata">ED</text>
  <text class="colh" x="986" y="384" text-anchor="middle" data-role="metadata">PRO</text>
  <text class="colh" x="1032" y="384" text-anchor="middle" data-role="metadata">TEC</text>
  <text class="colh" x="1078" y="384" text-anchor="middle" data-role="metadata">REG</text>
