<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=400" />
    <title>make-pretty-docs — hero</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js" integrity="sha384-bRevQK3DiusS1XALpRyWfXNcSVNuNxBOUk12Tk44IsnfepFlBwFe8h/82zWbDxqi" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Menlo"; src: local("Menlo"); }
      html, body { width: 1600px; height: 400px; overflow: hidden; background: #101418; }
      #root { position: relative; width: 1600px; height: 400px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1600" data-height="400">
      <section id="scene" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <svg id="stage" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace">
          <rect width="1600" height="400" rx="19" fill="#101418"/>

          <!-- left: the plain markdown doc -->
          <g transform="translate(120,83)">
            <rect width="200" height="235" rx="11" fill="#1a2027" stroke="#2c353f" stroke-width="2.5"/>
            <rect x="29" y="35" width="101" height="13" rx="6" fill="#8a97a3"/>
            <rect id="sk-1" x="29" y="69" width="141" height="8" rx="4" fill="#3d4854"/>
            <rect id="sk-2" x="29" y="91" width="125" height="8" rx="4" fill="#3d4854"/>
            <rect id="sk-3" x="29" y="112" width="136" height="8" rx="4" fill="#3d4854"/>
            <rect id="sk-4" x="29" y="147" width="141" height="8" rx="4" fill="#3d4854"/>
            <rect id="sk-5" x="29" y="168" width="112" height="8" rx="4" fill="#3d4854"/>
            <text x="100" y="221" text-anchor="middle" font-size="22" fill="#8a97a3">README.md</text>
          </g>

          <!-- middle: pipeline arrow -->
          <path id="pipe" d="M 360 200 H 560" fill="none" stroke="#4cc38a" stroke-width="4" stroke-dasharray="13 11"/>
          <path d="M 549 184 L 576 200 L 549 216" fill="#4cc38a"/>
          <text x="468" y="162" text-anchor="middle" font-size="22" fill="#4cc38a">render → webp</text>
          <!-- the traveling payload chip (starts invisible; each cycle fades in/out) -->
          <g id="chip" opacity="0" transform="translate(360,200)">
            <rect x="-38" y="-17" width="76" height="34" rx="8" fill="#101418" stroke="#4cc38a" stroke-width="2"/>
            <text x="0" y="7" text-anchor="middle" font-size="19" fill="#4cc38a">.webp</text>
          </g>

          <!-- right: the animated diagram panel -->
          <g transform="translate(607,69)">
            <rect id="panel-glow" width="440" height="261" rx="13" fill="none" stroke="#4cc38a" stroke-width="6" opacity="0.12"/>
            <rect width="440" height="261" rx="13" fill="#1a2027" stroke="#4cc38a" stroke-width="2.5"/>
            <!-- visible edges -->
            <g stroke="#8a97a3" stroke-width="2.5" fill="none">
              <path d="M 155 72 H 283"/>
              <path d="M 341 98 Q 341 197 280 197"/>
              <path d="M 163 197 Q 97 197 97 99"/>
            </g>
            <!-- invisible motion circuit through node centers -->
            <path id="circuit" d="M 97.5 71.5 H 341.5 L 221.5 197.5 Z" fill="none" stroke="none"/>
            <!-- traveling pulses (under the nodes, so they slip beneath them at corners) -->
            <circle id="dot-a" r="6.5" fill="#4cc38a"/>
            <circle id="dot-b" r="6.5" fill="#4cc38a" opacity="0.75"/>
            <circle id="dot-c" r="6.5" fill="#4cc38a" opacity="0.5"/>
            <!-- nodes -->
            <g font-size="20" fill="#dbe4ec" text-anchor="middle">
              <rect x="40" y="45" width="115" height="53" rx="9" fill="#233041" stroke="#4cc38a" stroke-width="2"/>
              <text x="97.5" y="78">client</text>
              <rect x="283" y="45" width="117" height="53" rx="9" fill="#233041" stroke="#4cc38a" stroke-width="2"/>
              <text x="341.5" y="78">service</text>
              <rect x="163" y="171" width="117" height="53" rx="9" fill="#233041" stroke="#4cc38a" stroke-width="2"/>
              <text x="221.5" y="204">store</text>
            </g>
            <text x="220" y="248" text-anchor="middle" font-size="20" fill="#8a97a3">seamless loop · ≤2.5 MB</text>
          </g>

          <!-- wordmark -->
          <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
            <text x="1120" y="171" font-size="45" font-weight="700" fill="#dbe4ec">make-pretty-docs</text>
            <text x="1120" y="216" font-size="24" fill="#8a97a3">truthful project docs,</text>
            <text x="1120" y="248" font-size="24" fill="#8a97a3">beautifully animated</text>
          </g>
        </svg>
      </section>
    </div>

    <script>
      gsap.registerPlugin(MotionPathPlugin);
      window.__timelines = window.__timelines || {};
      const D = 12;
      const tl = gsap.timeline({ paused: true });
      const mp = (s, e) => ({ path: "#circuit", start: s, end: e });

      // 1. pipeline dash flow — 6 whole dash periods (13+11=24) over D, linear → seamless
      tl.fromTo("#pipe", { strokeDashoffset: 0 }, { strokeDashoffset: -144, duration: D, ease: "none" }, 0);

      // 2. payload chip — self-contained 3s cycle × 4 (starts and ends invisible)
      {
        const sub = gsap.timeline({ paused: true });
        sub.set("#chip", { x: 360, y: 200 }, 0);
        sub.to("#chip", { opacity: 1, duration: 0.3 }, 0.2);
        sub.to("#chip", { x: 560, duration: 2.2, ease: "power1.inOut" }, 0.2);
        sub.to("#chip", { opacity: 0, duration: 0.3 }, 2.5);
        sub.set({}, {}, 3);
        for (let i = 0; i < 4; i++) tl.add(sub.tweenFromTo(0, 3), i * 3);
      }

      // 3. circuit pulses — 3 dots, lap 6s (2 laps in D), phases 0 / 1/3 / 2/3,
      //    phase-split at the loop boundary so travel is continuous through t=0
      tl.set("#dot-a", { motionPath: mp(0.0001, 0.0001) }, 0);
      tl.to("#dot-a", { motionPath: mp(0, 1), duration: 6, ease: "none" }, 0);
      tl.to("#dot-a", { motionPath: mp(0, 1), duration: 6, ease: "none" }, 6);

      tl.set("#dot-b", { motionPath: mp(1 / 3, 1 / 3) }, 0);
      tl.to("#dot-b", { motionPath: mp(1 / 3, 1), duration: 4, ease: "none" }, 0);
      tl.to("#dot-b", { motionPath: mp(0, 1), duration: 6, ease: "none" }, 4);
      tl.to("#dot-b", { motionPath: mp(0, 1 / 3), duration: 2, ease: "none" }, 10);

      tl.set("#dot-c", { motionPath: mp(2 / 3, 2 / 3) }, 0);
      tl.to("#dot-c", { motionPath: mp(2 / 3, 1), duration: 2, ease: "none" }, 0);
      tl.to("#dot-c", { motionPath: mp(0, 1), duration: 6, ease: "none" }, 2);
      tl.to("#dot-c", { motionPath: mp(0, 2 / 3), duration: 4, ease: "none" }, 8);

      // 4. skeleton bars shimmer — sine yoyo, D/half even for every bar
      [["#sk-1", 1.5], ["#sk-2", 2], ["#sk-3", 3], ["#sk-4", 1.5], ["#sk-5", 2]].forEach(([id, half]) => {
        tl.to(id, { opacity: 0.45, duration: half, ease: "sine.inOut", yoyo: true, repeat: D / half - 1 }, 0);
      });

      // 5. panel glow breath — half 3s, 4 half-cycles (even)
      tl.to("#panel-glow", { opacity: 0.3, duration: 3, ease: "sine.inOut", yoyo: true, repeat: D / 3 - 1 }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
