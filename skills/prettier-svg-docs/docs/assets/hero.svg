  <text class="cap" x="452" y="374" data-role="metadata" data-bg="surface">one is chosen per repo</text>
  <rect class="cell" x="800" y="220" width="360" height="160" rx="16" data-bg="surface"/>
  <text class="eye" x="832" y="258" data-bg="surface">GATE CLASSES</text>
