<title>Which svg_check.py class applies to which kind of visual</title>
<desc>DP security matrix specimen: six of the nine svg_check.py check classes as rows, four kinds of visual as columns, and in each cell what the checker actually does. The focal cell is min_elements, which is an error only under data-specimen. Three rows were trimmed to fit the 24-cell budget.</desc>
