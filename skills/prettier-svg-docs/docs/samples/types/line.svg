<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" data-loop-s="12" data-diagram="line" data-bg="background">
  <title>Repository file counts across twelve minor releases</title>
  <desc>A line chart with three series over plugin releases 0.4.0 to 0.15.0: Markdown files rising 31 to 169, SVG files 0 to 79, and style specimens 0 to 64. The specimen series is the accented one; it steps at 0.7.0 when the catalog was first committed and doubles at 0.12.0 when the static sibling shipped. The value axis starts at zero.</desc>
  <defs>
  <filter id="e1" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.28"/>
  </filter>
  </defs>
  <style>
  svg { --paper:#12324f; --surface:#17405f; --ink:#e8f2fb; --muted:#9fc4e8; --accent:#e0a33e; }
  text { font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .ttl { font-size:40px; font-weight:700; fill:var(--ink); }
  .src { font-size:16px; font-weight:500; fill:var(--muted); }
  .cat { font-size:18px; font-weight:600; fill:var(--ink); }
  .catf { font-size:18px; font-weight:600; fill:var(--paper); }
  .val { font-size:16px; font-weight:600; fill:var(--ink); }
  .valf { font-size:16px; font-weight:700; fill:var(--accent); }
  .tick { font-size:16px; font-weight:500; fill:var(--muted); }
  .lgd { font-size:16px; font-weight:600; fill:var(--ink); }
  .ser { animation: seq 12s ease-in-out infinite; }
  .s2 { animation-delay:-4s } .s3 { animation-delay:-8s }
  @keyframes seq { 0%,100% { stroke-opacity:.62 }
    10% { stroke-opacity:1 }
    30% { stroke-opacity:.62 } }
  @media (prefers-reduced-motion: reduce) {
    .ser { animation:none; stroke-opacity:1 }
  }
  </style>
  <rect x="0" y="0" width="1200" height="720" fill="var(--paper)"/>
  <text x="40" y="64" class="ttl" data-role="title" data-bg="background">Files per release, three ways</text>
  <text x="40" y="96" class="src" data-role="metadata" data-bg="background">git ls-tree -r --name-only &lt;rev&gt; at each 0.N.0 minor &#183; twelve releases, 0.4.0 to 0.15.0</text>
  <rect x="96" y="120" width="1056" height="456" rx="8" fill="var(--surface)" filter="url(#e1)"/>
  <g data-bg="surface">
    <line x1="96" y1="576" x2="1152" y2="576" stroke="var(--muted)" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="96" y1="500" x2="1152" y2="500" stroke="var(--muted)" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="96" y1="424" x2="1152" y2="424" stroke="var(--muted)" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="96" y1="348" x2="1152" y2="348" stroke="var(--muted)" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="96" y1="272" x2="1152" y2="272" stroke="var(--muted)" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="96" y1="196" x2="1152" y2="196" stroke="var(--muted)" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="96" y1="120" x2="1152" y2="120" stroke="var(--muted)" stroke-opacity="0.22" stroke-width="1"/>
  </g>
  <g data-node="" data-bg="surface">
    <polyline class="ser" points="96,497.47 192,406.27 288,358.13 384,358.13 480,353.07 576,340.4 672,335.33 768,330.27 864,196 960,173.2 1056,155.47 1152,147.87" fill="none" stroke="var(--ink)" stroke-width="1.25" stroke-opacity="1" stroke-linejoin="round"/>
  </g>
  <g data-node="" data-bg="surface">
    <polyline class="ser s2" points="96,576 192,568.4 288,563.33 384,484.8 480,482.27 576,479.73 672,474.67 768,474.67 864,388.53 960,388.53 1056,375.87 1152,375.87" fill="none" stroke="var(--muted)" stroke-width="1.25" stroke-opacity="1" stroke-dasharray="6 4" stroke-linejoin="round"/>
  </g>
  <g data-node="" data-focal="" data-bg="surface">
    <polyline class="ser s3" points="96,576 192,576 288,576 384,497.47 480,497.47 576,497.47 672,497.47 768,497.47 864,418.93 960,418.93 1056,413.87 1152,413.87" fill="none" stroke="var(--accent)" stroke-width="2" stroke-opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="96" cy="576" r="5" fill="var(--accent)"/>
    <circle cx="192" cy="576" r="5" fill="var(--accent)"/>
    <circle cx="288" cy="576" r="5" fill="var(--accent)"/>
    <circle cx="384" cy="497.47" r="5" fill="var(--accent)"/>
    <circle cx="480" cy="497.47" r="5" fill="var(--accent)"/>
    <circle cx="576" cy="497.47" r="5" fill="var(--accent)"/>
    <circle cx="672" cy="497.47" r="5" fill="var(--accent)"/>
    <circle cx="768" cy="497.47" r="5" fill="var(--accent)"/>
    <circle cx="864" cy="418.93" r="5" fill="var(--accent)"/>
    <circle cx="960" cy="418.93" r="5" fill="var(--accent)"/>
    <circle cx="1056" cy="413.87" r="5" fill="var(--accent)"/>
    <circle cx="1152" cy="413.87" r="5" fill="var(--accent)"/>
  </g>
  <text x="88" y="581" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">0</text>
  <text x="88" y="505" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">30</text>
  <text x="88" y="429" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">60</text>
  <text x="88" y="353" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">90</text>
  <text x="88" y="277" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">120</text>
  <text x="88" y="201" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">150</text>
  <text x="88" y="125" class="tick mono" data-role="metadata" data-bg="background" text-anchor="end">180</text>
  <text x="96" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.4.0</text>
  <text x="192" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.5.0</text>
  <text x="288" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.6.0</text>
  <text x="384" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.7.0</text>
  <text x="480" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.8.0</text>
  <text x="576" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.9.0</text>
  <text x="672" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.10.0</text>
  <text x="768" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.11.0</text>
  <text x="864" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.12.0</text>
  <text x="960" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.13.0</text>
  <text x="1056" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.14.0</text>
  <text x="1152" y="604" class="tick mono" data-role="metadata" data-bg="background" text-anchor="middle">0.15.0</text>
  <text x="96" y="634" class="src" data-role="metadata" data-bg="background">files tracked at that release &#183; horizontal axis is release order, not elapsed time</text>
  <g data-legend="">
    <line x1="96" y1="656" x2="1152" y2="656" stroke="var(--muted)" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="96" y1="686" x2="136" y2="686" stroke="var(--ink)" stroke-width="1.25"/>
    <text x="148" y="692" class="lgd" data-role="metadata" data-bg="background">Markdown files</text>
    <line x1="456" y1="686" x2="496" y2="686" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="6 4"/>
    <text x="508" y="692" class="lgd" data-role="metadata" data-bg="background">SVG files</text>
    <line x1="816" y1="686" x2="856" y2="686" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="836" cy="686" r="5" fill="var(--accent)"/>
    <text x="868" y="692" class="lgd" data-role="metadata" data-bg="background">Style specimens</text>
  </g>
</svg>
