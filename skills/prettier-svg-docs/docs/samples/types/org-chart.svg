  <text class="name" data-role="label" data-bg="surface" x="448" y="318" text-anchor="middle">svg_check.py</text>
  <text class="inv" data-role="metadata" data-bg="surface" x="448" y="342" text-anchor="middle">--design --style</text>
  <text class="scope" data-role="metadata" data-bg="surface" x="448" y="364" text-anchor="middle">nine check classes</text>
</g>
<g data-node="">
  <rect class="mask" x="656" y="280" width="200" height="96" rx="8"/>
  <rect class="box" x="656" y="280" width="200" height="96" rx="8"/>
  <text class="name" data-role="label" data-bg="surface" x="756" y="318" text-anchor="middle">audit_visuals.py</text>
  <text class="inv" data-role="metadata" data-bg="surface" x="756" y="342" text-anchor="middle">--root . *.md</text>
  <text class="scope" data-role="metadata" data-bg="surface" x="756" y="364" text-anchor="middle">embeds, manifests</text>
</g>
<g data-node="">
  <rect class="mask" x="964" y="280" width="200" height="96" rx="8"/>
  <rect class="boxo" x="964" y="280" width="200" height="96" rx="8"/>
  <text class="name" data-role="label" data-bg="background" x="1064" y="318" text-anchor="middle">The author</text>
  <text class="inv" data-role="metadata" data-bg="background" x="1064" y="342" text-anchor="middle">no entry point</text>
  <text class="scope" data-role="metadata" data-bg="background" x="1064" y="364" text-anchor="middle">seven questions</text>
</g>

<!-- tier 2: what tells svg_check.py what to enforce -->
<g data-node="">
