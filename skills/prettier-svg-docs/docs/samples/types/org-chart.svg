  <path class="edged" data-edge="" d="M664,216 V222 Q664,232 674,232 H1054 Q1064,232 1064,242 V280" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M584,216 V242 Q584,252 574,252 H458 Q448,252 448,262 V280" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M624,216 V242 Q624,252 634,252 H746 Q756,252 756,262 V280" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M398,376 V398 Q398,408 388,408 H218 Q208,408 208,418 V440" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M448,376 V440" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M498,376 V398 Q498,408 508,408 H678 Q688,408 688,418 V440" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M208,512 V576" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M448,512 V576" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="" d="M688,512 V576" marker-end="url(#arrow)"/>
</g>

<!-- connector labels -->
<g>
  <rect class="plate" data-label="" x="784" y="200" width="160" height="24" rx="4"/>
  <text class="elabel" data-role="metadata" data-bg="background" x="864" y="217" text-anchor="middle">NO CI STEP</text>
  <rect class="plate" data-label="" x="280" y="532" width="160" height="24" rx="4"/>
  <text class="elabel" data-role="metadata" data-bg="background" x="360" y="549" text-anchor="middle">ONE PER SLUG</text>
</g>

<!-- the front door -->
<g data-node="" data-focal="">
  <rect class="mask" x="504" y="120" width="200" height="96" rx="8"/>
  <rect class="boxf" x="504" y="120" width="200" height="96" rx="8"/>
  <text class="namef" data-role="label" data-bg="accent-primary" x="604" y="158" text-anchor="middle">The validate job</text>
  <text class="invf" data-role="metadata" data-bg="accent-primary" x="604" y="182" text-anchor="middle">skills + manifests</text>
  <text class="scopef" data-role="metadata" data-bg="accent-primary" x="604" y="204" text-anchor="middle">main, stage and PRs</text>
</g>

