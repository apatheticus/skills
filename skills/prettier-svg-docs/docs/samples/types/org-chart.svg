  <rect class="boxs" x="108" y="440" width="200" height="72" rx="8"/>
  <text class="name" data-role="label" data-bg="background" x="208" y="474" text-anchor="middle">Style catalog</text>
  <text class="inv" data-role="metadata" data-bg="background" x="208" y="496" text-anchor="middle">styles.json</text>
</g>
<g data-node="">
  <rect class="mask" x="348" y="440" width="200" height="72" rx="8"/>
