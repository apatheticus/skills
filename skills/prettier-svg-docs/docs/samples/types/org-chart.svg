<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" data-loop-s="12" data-diagram="org-chart" data-bg="background">
<title>Org chart — who owns which gate in prettier-svg-docs</title>
<desc>An ownership chart for this skill's gates. The front door is the repository's one CI job, named skills plus manifests, which runs on every push and pull request. It routes to three checkers — validate.mjs for frontmatter and the manifests, svg_check.py for its nine check classes, and audit_visuals.py for embeds and visual manifests. A fourth owner, the author, hangs off a dashed connector because no CI step invokes them: they own the seven questions in SKILL.md that no script can check. Under svg_check.py sit the three files that tell it what to enforce — styles.json, diagrams.json and prettydocs.md — and under each, what that file actually carries. A routing trace steps the front door to svg_check.py to the type catalog to the 27 type budgets on a 12-second loop; no box moves.</desc>
<defs>
  <filter id="e1" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.28"/>
  </filter>
  <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="var(--dim)"/>
  </marker>
</defs>
<style>
svg { --background:#12324f; --surface:#17405f; --ink:#e8f2fb; --dim:#9fc4e8; --accent:#e0a33e;
      --sans:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
.ground { fill: var(--background); }
.mask { fill: var(--background); }
.box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; filter: url(#e1); }
.boxf { fill: var(--accent); stroke: var(--accent); stroke-width: 1.25; filter: url(#e1); }
.boxs { fill: var(--ink); fill-opacity: .05; stroke: var(--dim); stroke-width: 1.25; }
.boxl { fill: var(--ink); fill-opacity: .05; stroke: var(--dim); stroke-width: 1; }
.boxo { fill: var(--ink); fill-opacity: .02; stroke: var(--dim); stroke-width: 1;
        stroke-dasharray: 4 3; }
.name { font: 600 18px var(--sans); fill: var(--ink); }
.namef{ font: 600 18px var(--sans); fill: var(--background); }
.inv  { font: 400 16px var(--mono); fill: var(--dim); }
.invf { font: 400 16px var(--mono); fill: var(--background); }
.scope{ font: 400 16px var(--sans); fill: var(--dim); }
.scopef{ font: 400 16px var(--sans); fill: var(--background); }
.edge { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.edged { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-dasharray: 4 3; }
.plate { fill: var(--background); }
.elabel { font: 600 16px var(--mono); fill: var(--dim); }
.kicker { font: 600 16px var(--mono); fill: var(--dim); letter-spacing: 1.5px; }
.h1 { font: 700 40px var(--sans); fill: var(--ink); }
.eyebrow { font: 600 16px var(--sans); fill: var(--dim); letter-spacing: 1px; }
.legend { font: 400 16px var(--sans); fill: var(--dim); }
.sep { stroke: var(--dim); stroke-width: 1; opacity: .45; }
.swatch { fill: none; stroke: var(--accent); stroke-width: 2; }
.swatch2 { fill: none; stroke: var(--dim); stroke-width: 1; stroke-dasharray: 4 3; }
.step { fill: none; stroke: var(--ink); stroke-width: 2; opacity: .14;
        animation: step 12s ease-in-out infinite; }
.s2 { animation-delay: -3s; }
.s3 { animation-delay: -6s; }
.s4 { animation-delay: -9s; }
@keyframes step { 0%, 100% { opacity: .14 } 6%, 18% { opacity: 1 } 26% { opacity: .14 } }
@media (prefers-reduced-motion: reduce) { .step { animation: none } }
</style>

<rect class="ground" x="0" y="0" width="1200" height="760"/>

<text class="kicker" data-role="metadata" data-bg="background" x="40" y="44">TYPE SPECIMEN · ORG-CHART · FLAT-MATERIAL</text>
<text class="h1" data-role="title" data-bg="background" x="40" y="92">Who owns which gate</text>

<!-- connectors: fanned attach points, one horizontal level per pair, no crossings -->
<g>
