<g data-node="">
  <rect class="mask" x="40" y="280" width="200" height="96" rx="8"/>
  <rect class="box" x="40" y="280" width="200" height="96" rx="8"/>
  <text class="name" data-role="label" data-bg="surface" x="140" y="318" text-anchor="middle">validate.mjs</text>
  <text class="inv" data-role="metadata" data-bg="surface" x="140" y="342" text-anchor="middle">npm run validate</text>
  <text class="scope" data-role="metadata" data-bg="surface" x="140" y="364" text-anchor="middle">frontmatter, manifests</text>
</g>
