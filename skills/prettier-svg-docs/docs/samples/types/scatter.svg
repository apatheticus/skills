  <title>Committed bytes against drawn elements, per style specimen</title>
  <desc>A scatter plot of thirty style specimens, drawn-element count on the horizontal axis and committed size in thousands of bytes on the vertical. Most of the cloud tracks a straight relation between the two; glassmorphism sits far above it at 73 elements and 15.7 KB, because its material is an eight-pass filter chain rather than more geometry. flat-material, the style this board is drawn in, sits low at 37 elements and 4.7 KB. Both axes start at zero.</desc>
