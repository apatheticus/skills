<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540"
     role="img" data-loop-s="12" data-diagram="it-state" data-bg="background">
  <title>The apatheticus/skills landscape before a shared module exists</title>
  <desc>The repository's seven skills grouped by what each one produces: three doc-visual
skills emitting animated SVG, static SVG and animated WebP; three skills emitting an
interactive HTML report; and one prose skill. The hand-offs between them are files copied by
hand — styles.json, svg_check.py and audit_visuals.py across the visual skills, and one
inlined SaaS Pro token set across the report skills. Nothing is imported; there is no shared
module. The dashes march on a twelve-second seamless cycle to say those copies keep being
made by hand.</desc>
