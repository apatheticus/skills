  <style>
    svg {
      --background:#12324f; --surface:#17405f; --ink:#e8f2fb; --dim:#9fc4e8;
      --accent:#e0a33e; --shadow:#000000;
      font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    }
    .bg { fill:var(--background); }
    .mask { fill:var(--background); }
    .card { fill:var(--surface); stroke:var(--ink); stroke-width:1.25; filter:url(#e1); }
    .focal { stroke:var(--accent); stroke-width:2.5; }
    .icon { color:var(--dim); }
    .name { fill:var(--ink); font-size:20px; font-weight:600;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .sub { fill:var(--dim); font-size:16px;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .zone { fill:var(--ink); fill-opacity:0.02; stroke:var(--dim); stroke-opacity:0.3;
             stroke-width:1; }
    .plate { fill:var(--background); }
    .eyebrow { fill:var(--dim); font-size:16px; letter-spacing:1px; font-weight:600; }
    .edgelabel { fill:var(--dim); font-size:16px; letter-spacing:0.5px; }
    .legenditem { fill:var(--dim); font-size:16px; }
    .rule { stroke:var(--dim); stroke-opacity:0.3; stroke-width:1; }
    .sw-focal { fill:none; stroke:var(--accent); stroke-width:2.5; }
    .sw-icon { fill:none; stroke:var(--dim); stroke-width:1.5; }
    .sw-edge { stroke:var(--dim); stroke-width:1.5; stroke-dasharray:8 6; }
    .kicker { fill:var(--dim); font-size:16px; letter-spacing:2px; font-weight:600; }
    .edge { fill:none; stroke:var(--dim); stroke-width:1.5; stroke-dasharray:8 6;
             marker-end:url(#arrow); animation:march 3s linear infinite; }
    @keyframes march {
      0%   { stroke-dashoffset:0; }
      100% { stroke-dashoffset:-14; }
    }
    @media (prefers-reduced-motion: reduce) {
      .edge { animation:none; }
    }
  </style>

