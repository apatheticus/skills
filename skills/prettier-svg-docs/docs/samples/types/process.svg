<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452" role="img" data-loop-s="12" data-diagram="process" data-bg="background">
<title>Process — the eight workflow phases</title>
<desc>Three lanes and eight ordered stages. The skill runs evidence, design system, plan, docs, visuals and report; you answer one batch of questions between plan and docs; the bundled checkers verify what phase 6 wrote. The handoff out of questions carries the saved answers, and the handoff out of visuals carries viz.json and the marker hashes.</desc>
<defs>
  <filter id="pr-e1" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="var(--shadow)" flood-opacity="0.38"/>
  </filter>
  <marker id="pr-ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--dim)"/>
  </marker>
  <marker id="pr-ara" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 Z" fill="var(--accent)"/>
  </marker>
</defs>
<style>
svg { --background:#12324f; --surface:#17405f; --ink:#e8f2fb; --dim:#9fc4e8; --accent:#e0a33e; --warn:#e2725b; --shadow:#000000; }
  .name { font: 700 18px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
  .onacc { font: 700 18px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--background); }
  .sub { font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--dim); }
  .subacc { font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--background); }
  .tag { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
  .tagacc { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--background); }
  .eyebrow { font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--dim); letter-spacing: .5px; }
  .key { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--accent); }
  .item { font: 400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
  .edgelabel { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
  .band { fill: var(--ink); fill-opacity: .03; stroke: var(--dim); stroke-width: 1; stroke-opacity: .3; }
  .chip { fill: var(--surface); stroke: var(--dim); stroke-width: 1; stroke-opacity: .5; }
  .box { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; filter: url(#pr-e1); }
  .focalbox { fill: var(--accent); stroke: var(--accent); stroke-width: 1.25; filter: url(#pr-e1); }
  .slot { fill: none; stroke: var(--dim); stroke-width: 1; stroke-opacity: .45; }
  .slotacc { fill: none; stroke: var(--background); stroke-width: 1; stroke-opacity: .55; }
  .edge { fill: none; stroke: var(--dim); stroke-width: 1.5; }
  .edgea { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .plate { fill: var(--background); }
  .em { fill: none; stroke: var(--accent); stroke-width: 2; animation: pr-em 12s ease-in-out infinite; }
  .p2 { animation-delay: -1.5s; }
  .p3 { animation-delay: -3s; }
  .p4 { animation-delay: -4.5s; }
  .p5 { animation-delay: -6s; }
  .p6 { animation-delay: -7.5s; }
  .p7 { animation-delay: -9s; }
  .p8 { animation-delay: -10.5s; }
  @keyframes pr-em { 0%, 100% { opacity: .08 } 6% { opacity: .75 } 18% { opacity: .08 } }
  @media (prefers-reduced-motion: reduce) {
    .em { animation: none; opacity: .08 }
  }
</style>
<rect x="0" y="0" width="1200" height="452" fill="var(--background)"/>
<text class="eyebrow" x="40" y="28" data-role="metadata" data-bg="background">PROCESS — THE EIGHT PHASES, AND WHO RUNS EACH</text>

<!-- lanes: one band per actor -->
<g data-zone="">
  <rect class="band" x="40" y="44" width="1120" height="104" rx="10"/>
  <rect class="chip" x="44" y="52" width="56" height="20" rx="4"/>
  <text class="tag" x="72" y="67" text-anchor="middle" data-role="metadata" data-bg="surface">SKL</text>
</g>
<g data-zone="">
  <rect class="band" x="40" y="148" width="1120" height="104" rx="10"/>
  <rect class="chip" x="44" y="156" width="56" height="20" rx="4"/>
  <text class="tag" x="72" y="171" text-anchor="middle" data-role="metadata" data-bg="surface">YOU</text>
</g>
<g data-zone="">
  <rect class="band" x="40" y="252" width="1120" height="104" rx="10"/>
  <rect class="chip" x="44" y="260" width="56" height="20" rx="4"/>
  <text class="tag" x="72" y="275" text-anchor="middle" data-role="metadata" data-bg="surface">CHK</text>
</g>

<!-- handoffs -->
<line class="edge" data-edge="" x1="224" y1="96" x2="244" y2="96" marker-end="url(#pr-ar)"/>
<line class="edge" data-edge="" x1="356" y1="96" x2="376" y2="96" marker-end="url(#pr-ar)"/>
<path class="edge" data-edge="" d="M488,96 H554 Q564,96 564,106 V160" marker-end="url(#pr-ar)"/>
<path class="edge" data-edge="" d="M620,200 H686 Q696,200 696,190 V136" marker-end="url(#pr-ar)"/>
<line class="edgea" data-edge="" x1="752" y1="96" x2="772" y2="96" marker-end="url(#pr-ara)"/>
<path class="edgea" data-edge="" d="M884,96 H950 Q960,96 960,106 V264" marker-end="url(#pr-ara)"/>
<path class="edge" data-edge="" d="M1016,304 H1082 Q1092,304 1092,294 V136" marker-end="url(#pr-ar)"/>

<!-- the two handoffs that carry a named artefact -->
<rect class="plate" data-label="" x="624" y="208" width="112" height="24" rx="4"/>
<text class="edgelabel" x="680" y="226" text-anchor="middle" data-role="metadata" data-bg="background">DOCSMETA</text>
<rect class="plate" data-label="" x="852" y="180" width="100" height="24" rx="4"/>
<text class="edgelabel" x="902" y="198" text-anchor="middle" data-role="metadata" data-bg="background">VIZ.JSON</text>

<!-- ordered emphasis, stage by stage, left to right -->
<rect class="em" x="108" y="52" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p2" x="240" y="52" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p3" x="372" y="52" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p4" x="504" y="156" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p5" x="636" y="52" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p6" x="768" y="52" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p7" x="900" y="260" width="120" height="88" rx="10" opacity=".08"/>
<rect class="em p8" x="1032" y="52" width="120" height="88" rx="10" opacity=".08"/>

<!-- stages -->
<g data-node="" data-bg="surface">
  <rect class="box" x="112" y="56" width="112" height="80" rx="8"/>
  <rect class="slot" x="120" y="64" width="40" height="20" rx="4"/>
  <text class="tag" x="140" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">SKL</text>
  <rect class="slot" x="192" y="64" width="24" height="20" rx="4"/>
  <text class="tag" x="204" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">1</text>
  <text class="name" x="168" y="108" text-anchor="middle" data-role="label" data-bg="surface">Evidence</text>
  <text class="sub" x="168" y="128" text-anchor="middle" data-role="metadata" data-bg="surface">repo facts</text>
</g>
<g data-node="" data-bg="surface">
  <rect class="box" x="244" y="56" width="112" height="80" rx="8"/>
  <rect class="slot" x="252" y="64" width="40" height="20" rx="4"/>
  <text class="tag" x="272" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">SKL</text>
  <rect class="slot" x="324" y="64" width="24" height="20" rx="4"/>
  <text class="tag" x="336" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">2</text>
  <text class="name" x="300" y="108" text-anchor="middle" data-role="label" data-bg="surface">Design</text>
  <text class="sub" x="300" y="128" text-anchor="middle" data-role="metadata" data-bg="surface">style first</text>
</g>
<g data-node="" data-bg="surface">
  <rect class="box" x="376" y="56" width="112" height="80" rx="8"/>
  <rect class="slot" x="384" y="64" width="40" height="20" rx="4"/>
  <text class="tag" x="404" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">SKL</text>
  <rect class="slot" x="456" y="64" width="24" height="20" rx="4"/>
  <text class="tag" x="468" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">3</text>
  <text class="name" x="432" y="108" text-anchor="middle" data-role="label" data-bg="surface">Plan</text>
  <text class="sub" x="432" y="128" text-anchor="middle" data-role="metadata" data-bg="surface">docs + viz</text>
</g>
<g data-node="" data-bg="surface">
  <rect class="box" x="508" y="160" width="112" height="80" rx="8"/>
  <rect class="slot" x="516" y="168" width="40" height="20" rx="4"/>
  <text class="tag" x="536" y="183" text-anchor="middle" data-role="metadata" data-bg="surface">YOU</text>
  <rect class="slot" x="588" y="168" width="24" height="20" rx="4"/>
  <text class="tag" x="600" y="183" text-anchor="middle" data-role="metadata" data-bg="surface">4</text>
  <text class="name" x="564" y="212" text-anchor="middle" data-role="label" data-bg="surface">Questions</text>
  <text class="sub" x="564" y="232" text-anchor="middle" data-role="metadata" data-bg="surface">once only</text>
</g>
<g data-node="" data-bg="surface">
  <rect class="box" x="640" y="56" width="112" height="80" rx="8"/>
  <rect class="slot" x="648" y="64" width="40" height="20" rx="4"/>
  <text class="tag" x="668" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">SKL</text>
  <rect class="slot" x="720" y="64" width="24" height="20" rx="4"/>
  <text class="tag" x="732" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">5</text>
  <text class="name" x="696" y="108" text-anchor="middle" data-role="label" data-bg="surface">Docs</text>
  <text class="sub" x="696" y="128" text-anchor="middle" data-role="metadata" data-bg="surface">by section</text>
</g>
<g data-node="" data-focal="" data-bg="accent-primary">
  <rect class="focalbox" x="772" y="56" width="112" height="80" rx="8"/>
  <rect class="slotacc" x="780" y="64" width="40" height="20" rx="4"/>
  <text class="tagacc" x="800" y="79" text-anchor="middle" data-role="metadata" data-bg="accent-primary">SKL</text>
  <rect class="slotacc" x="852" y="64" width="24" height="20" rx="4"/>
  <text class="tagacc" x="864" y="79" text-anchor="middle" data-role="metadata" data-bg="accent-primary">6</text>
  <text class="onacc" x="828" y="108" text-anchor="middle" data-role="label" data-bg="accent-primary">Visuals</text>
  <text class="subacc" x="828" y="128" text-anchor="middle" data-role="metadata" data-bg="accent-primary">author, gate</text>
</g>
<g data-node="" data-bg="surface">
  <rect class="box" x="904" y="264" width="112" height="80" rx="8"/>
  <rect class="slot" x="912" y="272" width="40" height="20" rx="4"/>
  <text class="tag" x="932" y="287" text-anchor="middle" data-role="metadata" data-bg="surface">CHK</text>
  <rect class="slot" x="984" y="272" width="24" height="20" rx="4"/>
  <text class="tag" x="996" y="287" text-anchor="middle" data-role="metadata" data-bg="surface">7</text>
  <text class="name" x="960" y="316" text-anchor="middle" data-role="label" data-bg="surface">Verify</text>
  <text class="sub" x="960" y="336" text-anchor="middle" data-role="metadata" data-bg="surface">ten gates</text>
</g>
<g data-node="" data-bg="surface">
  <rect class="box" x="1036" y="56" width="112" height="80" rx="8"/>
  <rect class="slot" x="1044" y="64" width="40" height="20" rx="4"/>
  <text class="tag" x="1064" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">SKL</text>
  <rect class="slot" x="1116" y="64" width="24" height="20" rx="4"/>
  <text class="tag" x="1128" y="79" text-anchor="middle" data-role="metadata" data-bg="surface">8</text>
  <text class="name" x="1092" y="108" text-anchor="middle" data-role="label" data-bg="surface">Report</text>
  <text class="sub" x="1092" y="128" text-anchor="middle" data-role="metadata" data-bg="surface">in chat</text>
</g>

<!-- legend: the lane keys, and what the one accent means -->
<g data-legend="">
  <line x1="40" y1="372" x2="1160" y2="372" stroke="var(--dim)" stroke-width="1" stroke-opacity=".4"/>
  <text class="key" x="40" y="398" data-role="metadata" data-bg="background">SKL</text>
  <text class="item" x="104" y="398" data-role="metadata" data-bg="background">the skill runs the phase</text>
  <text class="key" x="400" y="398" data-role="metadata" data-bg="background">YOU</text>
  <text class="item" x="464" y="398" data-role="metadata" data-bg="background">one batch of questions, up front</text>
  <text class="key" x="800" y="398" data-role="metadata" data-bg="background">CHK</text>
  <text class="item" x="864" y="398" data-role="metadata" data-bg="background">the bundled checkers</text>
  <text class="item" x="40" y="426" data-role="metadata" data-bg="background">The accent marks phase 6 and the two handoffs it owns — everything else is one treatment.</text>
</g>
</svg>
