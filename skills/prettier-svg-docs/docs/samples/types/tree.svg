<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 744" width="1200" height="744" role="img" data-loop-s="12" data-diagram="tree" data-bg="background">
<title>Tree — the prettier-svg-docs reference tree</title>
<desc>A depth-4 tree of this skill's own reference directory. The root is reference slash; it branches to diagrams.md, the router for the 27 diagram types, and to styles.md, the router for the 32 styles. Under diagrams.md sit the shared grammar, the shared patterns file and the types directory; under styles.md sits the styles directory. The two directories each terminate in one aggregated leaf — 27 type specs and 32 style specs. An emphasis walks root to leaf down the diagrams branch on a 12-second loop; nothing moves.</desc>
<defs>
  <filter id="e1" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.28"/>
  </filter>
  <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="var(--dim)"/>
  </marker>
</defs>
<style>
svg { --background:#12324f; --surface:#17405f; --ink:#e8f2fb; --dim:#9fc4e8; --accent:#e0a33e;
      --sans:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,monospace; }
.ground { fill: var(--background); }
.mask { fill: var(--background); }
.box  { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; filter: url(#e1); }
.boxl { fill: var(--surface); stroke: var(--dim); stroke-width: 1; filter: url(#e1); }
.boxf { fill: var(--accent); stroke: var(--accent); stroke-width: 1.25; filter: url(#e1); }
.chip { fill: none; stroke: var(--dim); stroke-width: 1; }
.chipf { fill: none; stroke: var(--background); stroke-width: 1; }
.tag  { font: 600 16px var(--mono); fill: var(--dim); }
.tagf { font: 600 16px var(--mono); fill: var(--background); }
.name { font: 600 20px var(--sans); fill: var(--ink); }
.namef{ font: 600 20px var(--sans); fill: var(--background); }
.sub  { font: 400 16px var(--mono); fill: var(--dim); }
.subf { font: 400 16px var(--mono); fill: var(--background); }
.edge { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.plate { fill: var(--background); }
.elabel { font: 600 16px var(--mono); fill: var(--dim); }
.kicker { font: 600 16px var(--mono); fill: var(--dim); letter-spacing: 1.5px; }
.h1 { font: 700 40px var(--sans); fill: var(--ink); }
.eyebrow { font: 600 16px var(--sans); fill: var(--dim); letter-spacing: 1px; }
.legend { font: 400 16px var(--sans); fill: var(--dim); }
.sep { stroke: var(--dim); stroke-width: 1; opacity: .45; }
.swatch { fill: none; stroke: var(--accent); stroke-width: 2; }
.swatch2 { fill: none; stroke: var(--dim); stroke-width: 1; }
.step { fill: none; stroke: var(--ink); stroke-width: 2; opacity: .14;
        animation: step 12s ease-in-out infinite; }
.s2 { animation-delay: -3s; }
.s3 { animation-delay: -6s; }
.s4 { animation-delay: -9s; }
@keyframes step { 0%, 100% { opacity: .14 } 6%, 18% { opacity: 1 } 26% { opacity: .14 } }
@media (prefers-reduced-motion: reduce) { .step { animation: none } }
</style>

<rect class="ground" x="0" y="0" width="1200" height="744"/>

<text class="kicker" data-role="metadata" data-bg="background" x="40" y="44">TYPE SPECIMEN · TREE · FLAT-MATERIAL</text>
<text class="h1" data-role="title" data-bg="background" x="40" y="92">reference/ — one router, two catalogs</text>

