<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668"
     data-loop-s="12" data-diagram="medallion" role="img" data-bg="background">
  <title>Medallion — the three quality tiers a visual passes through in this skill</title>
  <desc>Three tall cards side by side: Candidate, an authored SVG in the working tree
  that may not be embedded; Gated, committed under docs/assets once svg_check.py reports
  zero errors and every softened line is recorded; and Published, the focal tier, carrying
  viz.json and the facts, src and design hash triad. Two promotion connectors run over the
  top of the cards, labelled GATE and STAMP, each carrying one travelling token.</desc>

  <defs>
    <filter id="e1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <style>
    svg {
      --background: #12324f;
      --surface: #17405f;
      --ink: #e8f2fb;
      --dim: #9fc4e8;
      --accent: #e0a33e;
      --sans: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .name  { font-family: var(--sans); font-size: 24px; font-weight: 700; fill: var(--ink); }
    .idx   { font-family: var(--mono); font-size: 16px; fill: var(--dim); }
    .key   { font-family: var(--sans); font-size: 16px; font-weight: 600; fill: var(--dim);
             letter-spacing: 0.5px; }
    .val   { font-family: var(--sans); font-size: 16px; font-weight: 600; fill: var(--ink); }
    .mono  { font-family: var(--mono); font-size: 16px; fill: var(--dim); }
    .monoi { font-family: var(--mono); font-size: 16px; fill: var(--ink); }
    .edgelabel { font-family: var(--sans); font-size: 16px; font-weight: 600;
                 fill: var(--ink); letter-spacing: 0.5px; }

    .ground { fill: var(--background); }
    .mask   { fill: var(--background); }
    .plate  { fill: var(--background); }
    .card-a { fill: var(--dim); fill-opacity: 0.10; stroke: var(--dim); stroke-width: 1.25; }
    .card-b { fill: var(--surface); stroke: var(--ink); stroke-width: 1.25; }
    .card-c { fill: var(--accent); fill-opacity: 0.12; stroke: var(--accent); stroke-width: 1.5; }
    .band-a { fill: var(--dim); fill-opacity: 0.10; }
    .band-b { fill: var(--ink); fill-opacity: 0.06; }
    .band-c { fill: var(--accent); fill-opacity: 0.16; }
    .hair   { stroke: var(--dim); stroke-opacity: 0.45; stroke-width: 1; }
    .wire   { fill: none; stroke: var(--dim); stroke-width: 1.5; }
    .wire-a { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .sw-a   { fill: var(--dim); fill-opacity: 0.10; stroke: var(--dim); stroke-width: 1; }
    .sw-b   { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .sw-c   { fill: var(--accent); fill-opacity: 0.12; stroke: var(--accent); stroke-width: 1; }

    /* One motion idea: a token per promotion, in tier order. The cards, their text
       and the connectors themselves never move. */
    .tok  { animation: tokfade 12s linear infinite; }
    .tok2 { animation-delay: -6s; }
    @keyframes tokfade {
      0%   { opacity: 0 }
      8%   { opacity: 1 }
      42%  { opacity: 1 }
      50%  { opacity: 0 }
      100% { opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .tok { animation: none; display: none; }
    }
  </style>

  <rect class="ground" x="0" y="0" width="1200" height="668"/>

  <!-- promotion connectors, over the band; drawn before their labels and the cards -->
  <path id="p1" class="wire" data-edge="" marker-end="url(#arrow)"
        d="M 218,100 V 54 Q 218,44 228,44 H 588 Q 598,44 598,54 V 100"/>
  <path id="p2" class="wire-a" data-edge="" marker-end="url(#arrow-a)"
        d="M 598,100 V 54 Q 598,44 608,44 H 968 Q 978,44 978,54 V 100"/>

  <circle class="tok tok1" r="6" fill="var(--dim)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <circle class="tok tok2" r="6" fill="var(--accent)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#p2"/>
    </animateMotion>
  </circle>

  <!-- connector labels: 8 units of clear air above the stroke -->
  <g data-bg="background">
    <rect data-label="" class="plate" x="368" y="14" width="80" height="22" rx="4"/>
    <text class="edgelabel" x="408" y="30" data-role="metadata" data-bg="background"
          text-anchor="middle">GATE</text>
    <rect data-label="" class="plate" x="744" y="14" width="88" height="22" rx="4"/>
    <text class="edgelabel" x="788" y="30" data-role="metadata" data-bg="background"
          text-anchor="middle">STAMP</text>
  </g>

  <!-- tier 1 -->
  <g data-node="" data-bg="surface">
    <rect class="mask" x="40" y="100" width="356" height="476" rx="8"/>
    <rect class="card-a" x="40" y="100" width="356" height="476" rx="8" filter="url(#e1)"/>
    <rect class="band-a" x="40" y="100" width="356" height="48" rx="8"/>
    <rect class="band-a" x="40" y="148" width="356" height="12"/>
    <text class="name" x="60" y="132" data-role="label" data-bg="surface">Candidate</text>
    <text class="idx" x="376" y="132" data-role="metadata" data-bg="surface"
          text-anchor="end">01</text>
    <text class="mono" x="60" y="180" data-role="metadata" data-bg="surface">working tree</text>
    <text class="key" x="60" y="224" data-role="metadata" data-bg="surface">WRITTEN BY</text>
    <text class="val" x="60" y="248" data-role="metadata" data-bg="surface">Author, phase 6</text>
    <text class="key" x="60" y="276" data-role="metadata" data-bg="surface">FORMAT</text>
    <text class="val" x="60" y="300" data-role="metadata" data-bg="surface">Hand-authored SVG</text>
    <text class="key" x="60" y="324" data-role="metadata" data-bg="surface">ACCESS</text>
    <text class="val" x="60" y="348" data-role="metadata" data-bg="surface">Not embeddable</text>
    <line class="hair" x1="60" y1="424" x2="376" y2="424"/>
    <text class="key" x="60" y="444" data-role="metadata" data-bg="surface">STATE</text>
    <text class="mono" x="60" y="472" data-role="metadata" data-bg="surface">svg_check.py — not run</text>
    <text class="mono" x="60" y="500" data-role="metadata" data-bg="surface">viz.json — absent</text>
  </g>

  <!-- tier 2 -->
  <g data-node="" data-bg="surface">
    <rect class="mask" x="420" y="100" width="356" height="476" rx="8"/>
    <rect class="card-b" x="420" y="100" width="356" height="476" rx="8" filter="url(#e1)"/>
    <rect class="band-b" x="420" y="100" width="356" height="48" rx="8"/>
    <rect class="band-b" x="420" y="148" width="356" height="12"/>
    <text class="name" x="440" y="132" data-role="label" data-bg="surface">Gated</text>
    <text class="idx" x="756" y="132" data-role="metadata" data-bg="surface"
          text-anchor="end">02</text>
    <text class="mono" x="440" y="180" data-role="metadata" data-bg="surface">docs/assets/</text>
    <text class="key" x="440" y="224" data-role="metadata" data-bg="surface">WRITTEN BY</text>
    <text class="val" x="440" y="248" data-role="metadata" data-bg="surface">svg_check.py loop</text>
    <text class="key" x="440" y="276" data-role="metadata" data-bg="surface">FORMAT</text>
    <text class="val" x="440" y="300" data-role="metadata" data-bg="surface">SVG at zero errors</text>
    <text class="key" x="440" y="324" data-role="metadata" data-bg="surface">ACCESS</text>
    <text class="val" x="440" y="348" data-role="metadata" data-bg="surface">Embeddable</text>
    <line class="hair" x1="440" y1="424" x2="756" y2="424"/>
    <text class="key" x="440" y="444" data-role="metadata" data-bg="surface">STATE</text>
    <text class="mono" x="440" y="472" data-role="metadata" data-bg="surface">0 error(s) — required</text>
    <text class="mono" x="440" y="500" data-role="metadata" data-bg="surface">SOFTENED — recorded</text>
  </g>

  <!-- tier 3, the focal surface everything else exists to reach -->
  <g data-node="" data-focal="" data-bg="surface">
    <rect class="mask" x="800" y="100" width="356" height="476" rx="8"/>
    <rect class="card-c" x="800" y="100" width="356" height="476" rx="8" filter="url(#e1)"/>
    <rect class="band-c" x="800" y="100" width="356" height="48" rx="8"/>
    <rect class="band-c" x="800" y="148" width="356" height="12"/>
    <text class="name" x="820" y="132" data-role="label" data-bg="surface">Published</text>
    <text class="idx" x="1136" y="132" data-role="metadata" data-bg="surface"
          text-anchor="end">03</text>
    <text class="monoi" x="820" y="180" data-role="metadata" data-bg="surface">docs/assets/ + viz.json</text>
    <text class="key" x="820" y="224" data-role="metadata" data-bg="surface">WRITTEN BY</text>
    <text class="val" x="820" y="248" data-role="metadata" data-bg="surface">Phase 6 + viz.json</text>
    <text class="key" x="820" y="276" data-role="metadata" data-bg="surface">FORMAT</text>
    <text class="val" x="820" y="300" data-role="metadata" data-bg="surface">SVG + hash triad</text>
    <text class="key" x="820" y="324" data-role="metadata" data-bg="surface">ACCESS</text>
    <text class="val" x="820" y="348" data-role="metadata" data-bg="surface">Embedded via pd:viz</text>
    <line class="hair" x1="820" y1="424" x2="1136" y2="424"/>
    <text class="key" x="820" y="444" data-role="metadata" data-bg="surface">STATE</text>
    <text class="monoi" x="820" y="472" data-role="metadata" data-bg="surface">facts · src · design</text>
    <text class="monoi" x="820" y="500" data-role="metadata" data-bg="surface">audit_visuals.py — OK</text>
  </g>

  <!-- legend: a strip below every card -->
  <g data-legend="" data-bg="background">
    <line class="hair" x1="40" y1="600" x2="1160" y2="600"/>
    <text class="key" x="40" y="632" data-role="metadata" data-bg="background">LEGEND</text>
    <rect class="sw-a" x="168" y="618" width="20" height="20" rx="4"/>
    <text class="key" x="196" y="632" data-role="metadata" data-bg="background">UNGATED — NO EMBED</text>
    <rect class="sw-b" x="496" y="618" width="20" height="20" rx="4"/>
    <text class="key" x="524" y="632" data-role="metadata" data-bg="background">GATED — EMBEDDABLE</text>
    <rect class="sw-c" x="820" y="618" width="20" height="20" rx="4"/>
    <text class="key" x="848" y="632" data-role="metadata" data-bg="background">FOCAL — PUBLISHED</text>
  </g>
</svg>
