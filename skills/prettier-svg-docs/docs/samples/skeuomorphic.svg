<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="12" data-bg="var(--panel)" data-specimen="true">
<title>Skeuomorphic — Source, Transform, Store</title>
<desc>A machined console: bevelled panels with a hard tonal break at the midline, recessed bays, brass bezels with glowing lamps and sagging cables between the bays.</desc>
<defs>
  <linearGradient id="sk-bevel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--panellt)"/>
    <stop offset="0.5" stop-color="var(--panel)"/>
    <stop offset="0.5" stop-color="var(--paneldk)"/>
    <stop offset="1" stop-color="var(--panel)"/>
  </linearGradient>
  <radialGradient id="sk-lamp" cx=".5" cy=".5">
    <stop offset="0" stop-color="var(--lamp)" stop-opacity=".9"/>
    <stop offset="1" stop-color="var(--lamp)" stop-opacity="0"/>
  </radialGradient>
  <filter id="sk-g" data-style="skeuomorphic" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="2" seed="14"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
  </filter>
</defs>
<style>
svg { --ground:#3B3128; --felt:#4A3C2C; --panel:#D8CDBA; --paneldk:#A2947C; --panellt:#EFE7D6; --ink:#241C12; --muted:#4A3D2A; --brass:#B8892B; --lamp:#FFE9A8; --cable:#2C241A; }
  .sk-h { font: 700 36px Georgia, serif; fill: var(--ink); letter-spacing: 2px; }
  .sk-t { font: 700 24px Georgia, serif; fill: var(--ink); }
  .sk-s { font: 400 19px Georgia, serif; fill: var(--muted); }
  .sk-f { font: 400 18px Georgia, serif; fill: var(--panellt); }
  .sk-e { fill: none; stroke: var(--paneldk); stroke-width: 2; }
  .sk-hi { fill: none; stroke: var(--panellt); stroke-width: 1.4; opacity: .8; }
  .sk-c { fill: none; stroke: var(--cable); stroke-width: 6; stroke-linecap: round; }
  .sk-lamp { animation: sk-lamp 4s ease-in-out infinite; }
  @keyframes sk-lamp { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .sk-lamp { animation: none; opacity: 1 } }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--felt)"/>
<rect x="40" y="26" width="1120" height="408" rx="14" fill="url(#sk-bevel)"/>
<rect x="40" y="26" width="1120" height="408" rx="14" class="sk-e"/>
<rect x="48" y="34" width="1104" height="392" rx="10" class="sk-hi"/>
<g data-bg="var(--panel)"><text class="sk-h" x="88" y="90">CONSOLE</text>
<text class="sk-s" x="88" y="122">machined housing — brass fittings</text></g>
<rect x="80" y="180" width="300" height="150" rx="10" fill="var(--paneldk)"/>
<rect x="83" y="183" width="294" height="144" rx="8" fill="url(#sk-bevel)"/>
<rect class="sk-hi" x="83" y="183" width="294" height="144" rx="8"/>
<rect x="96" y="286" width="268" height="26" rx="6" fill="var(--ink)" opacity=".18"/>
<circle cx="350" cy="210" r="10" fill="var(--brass)"/>
<circle cx="350" cy="210" r="5" fill="url(#sk-lamp)" class="sk-lamp"/>
<g data-bg="var(--panel)"><text class="sk-s" x="96" y="214">BAY 1</text></g>
<line class="sk-hi" x1="100" y1="290" x2="100" y2="306"/>
<line class="sk-hi" x1="140" y1="290" x2="140" y2="306"/>
<line class="sk-hi" x1="180" y1="290" x2="180" y2="306"/>
<line class="sk-hi" x1="220" y1="290" x2="220" y2="306"/>
<rect x="450" y="180" width="300" height="150" rx="10" fill="var(--paneldk)"/>
<rect x="453" y="183" width="294" height="144" rx="8" fill="url(#sk-bevel)"/>
<rect class="sk-hi" x="453" y="183" width="294" height="144" rx="8"/>
<rect x="466" y="286" width="268" height="26" rx="6" fill="var(--ink)" opacity=".18"/>
<circle cx="720" cy="210" r="10" fill="var(--brass)"/>
<circle cx="720" cy="210" r="5" fill="url(#sk-lamp)" class="sk-lamp"/>
<g data-bg="var(--panel)"><text class="sk-s" x="466" y="214">BAY 2</text></g>
<line class="sk-hi" x1="470" y1="290" x2="470" y2="306"/>
<line class="sk-hi" x1="510" y1="290" x2="510" y2="306"/>
<line class="sk-hi" x1="550" y1="290" x2="550" y2="306"/>
<line class="sk-hi" x1="590" y1="290" x2="590" y2="306"/>
<rect x="820" y="180" width="300" height="150" rx="10" fill="var(--paneldk)"/>
<rect x="823" y="183" width="294" height="144" rx="8" fill="url(#sk-bevel)"/>
<rect class="sk-hi" x="823" y="183" width="294" height="144" rx="8"/>
<rect x="836" y="286" width="268" height="26" rx="6" fill="var(--ink)" opacity=".18"/>
<circle cx="1090" cy="210" r="10" fill="var(--brass)"/>
<circle cx="1090" cy="210" r="5" fill="url(#sk-lamp)" class="sk-lamp"/>
<g data-bg="var(--panel)"><text class="sk-s" x="836" y="214">BAY 3</text></g>
<line class="sk-hi" x1="840" y1="290" x2="840" y2="306"/>
<line class="sk-hi" x1="880" y1="290" x2="880" y2="306"/>
<line class="sk-hi" x1="920" y1="290" x2="920" y2="306"/>
<line class="sk-hi" x1="960" y1="290" x2="960" y2="306"/>
<g data-bg="var(--panel)">
  <text class="sk-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="sk-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--panel)">
  <text class="sk-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="sk-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--panel)">
  <text class="sk-t" x="970" y="258" text-anchor="middle">Store</text>
  <text class="sk-s" x="970" y="288" text-anchor="middle">warehouse</text>
</g>
<path class="sk-c" d="M380 255 q35 26 70 0"/>
<circle cx="380" cy="255" r="6" fill="var(--brass)"/>
<circle cx="450" cy="255" r="6" fill="var(--brass)"/>
<path class="sk-c" d="M750 255 q35 26 70 0"/>
<circle cx="750" cy="255" r="6" fill="var(--brass)"/>
<circle cx="820" cy="255" r="6" fill="var(--brass)"/>
<rect x="88" y="386" width="1024" height="30" rx="6" fill="var(--ink)" opacity=".16"/>
<g data-bg="var(--panel)"><text class="sk-s" x="102" y="407">status: nominal — all bays reporting</text></g>
<rect x="40" y="26" width="1120" height="408" rx="14" filter="url(#sk-g)" style="mix-blend-mode:overlay"/>
</svg>
