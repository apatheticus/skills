<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="12" data-bg="var(--ground)" data-specimen="true">
<title>Holographic projection — Source, Transform, Store</title>
<desc>Three translucent panels floating in a projection cone above a glowing emitter, with lit corner nodes, travelling scanlines and a stepped flicker.</desc>
<defs>
  <filter id="hp-glow" data-style="holographic-projection" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="hp-cone" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="var(--emit)" stop-opacity=".55"/>
    <stop offset="1" stop-color="var(--emit)" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
svg { --ground:#040A16; --cyan:#5EEAD4; --cyanlt:#CFFAFE; --blue:#60A5FA; --violet:#A78BFA; --ink:#E0FBFF; --muted:#A5F3FC; --panel:#082032; --emit:#0EA5E9; }
  .hp-h { font: 400 36px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 5px; }
  .hp-t { font: 500 24px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 2px; }
  .hp-s { font: 400 19px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .hp-f { font: 400 18px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .hp-e { fill: none; stroke: var(--cyan); stroke-width: 1.5; }
  .hp-fl { animation: hp-fl 3s steps(6, end) infinite; }
  @keyframes hp-fl { 0%,100% { opacity: .82 } 50% { opacity: 1 } }
  .hp-sc { animation: hp-sc 4s linear infinite; }
  @keyframes hp-sc { from { transform: translateY(0) } to { transform: translateY(40px) } }
  @media (prefers-reduced-motion: reduce) { .hp-fl, .hp-sc { animation: none; opacity: 1 } }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<polygon points="600,452 120,150 1080,150" fill="url(#hp-cone)"/>
<ellipse cx="600" cy="450" rx="70" ry="10" fill="var(--emit)" filter="url(#hp-glow)"/>
<text class="hp-h" x="80" y="76" filter="url(#hp-glow)">PROJECTION</text>
<text class="hp-f" x="80" y="108">volumetric — 3 nodes resolved</text>
<g class="hp-fl">
  <rect x="80" y="180" width="300" height="150" rx="6" fill="var(--panel)" opacity=".7"/>
  <rect class="hp-e" x="80" y="180" width="300" height="150" rx="6" filter="url(#hp-glow)"/>
  <line class="hp-e" x1="80" y1="220" x2="380" y2="220" opacity=".6"/>
  <circle cx="80" cy="180" r="4" fill="var(--cyanlt)"/>
  <circle cx="380" cy="180" r="4" fill="var(--cyanlt)"/>
  <circle cx="80" cy="330" r="4" fill="var(--cyanlt)"/>
  <circle cx="380" cy="330" r="4" fill="var(--cyanlt)"/>
  <g data-bg="var(--panel)"><text class="hp-f" x="94" y="208">NODE 1</text></g>
  <rect x="450" y="180" width="300" height="150" rx="6" fill="var(--panel)" opacity=".7"/>
  <rect class="hp-e" x="450" y="180" width="300" height="150" rx="6" filter="url(#hp-glow)"/>
  <line class="hp-e" x1="450" y1="220" x2="750" y2="220" opacity=".6"/>
  <circle cx="450" cy="180" r="4" fill="var(--cyanlt)"/>
  <circle cx="750" cy="180" r="4" fill="var(--cyanlt)"/>
  <circle cx="450" cy="330" r="4" fill="var(--cyanlt)"/>
  <circle cx="750" cy="330" r="4" fill="var(--cyanlt)"/>
  <g data-bg="var(--panel)"><text class="hp-f" x="464" y="208">NODE 2</text></g>
  <rect x="820" y="180" width="300" height="150" rx="6" fill="var(--panel)" opacity=".7"/>
  <rect class="hp-e" x="820" y="180" width="300" height="150" rx="6" filter="url(#hp-glow)"/>
  <line class="hp-e" x1="820" y1="220" x2="1120" y2="220" opacity=".6"/>
  <circle cx="820" cy="180" r="4" fill="var(--cyanlt)"/>
  <circle cx="1120" cy="180" r="4" fill="var(--cyanlt)"/>
  <circle cx="820" cy="330" r="4" fill="var(--cyanlt)"/>
  <circle cx="1120" cy="330" r="4" fill="var(--cyanlt)"/>
  <g data-bg="var(--panel)"><text class="hp-f" x="834" y="208">NODE 3</text></g>
</g>
<g data-bg="var(--panel)">
  <text class="hp-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="hp-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--panel)">
  <text class="hp-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="hp-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--panel)">
  <text class="hp-t" x="970" y="258" text-anchor="middle">Store</text>
  <text class="hp-s" x="970" y="288" text-anchor="middle">warehouse</text>
</g>
<g class="hp-sc" opacity=".28">
  <line x1="80" y1="110" x2="1120" y2="110" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="150" x2="1120" y2="150" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="190" x2="1120" y2="190" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="230" x2="1120" y2="230" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="270" x2="1120" y2="270" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="310" x2="1120" y2="310" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="350" x2="1120" y2="350" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="390" x2="1120" y2="390" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="430" x2="1120" y2="430" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="470" x2="1120" y2="470" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="510" x2="1120" y2="510" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="590" x2="1120" y2="590" stroke="var(--cyan)" stroke-width="1"/>
  <line x1="80" y1="630" x2="1120" y2="630" stroke="var(--cyan)" stroke-width="1"/>
</g>
<line class="hp-e" x1="380" y1="261" x2="450" y2="261" filter="url(#hp-glow)"/>
<line class="hp-e" x1="750" y1="261" x2="820" y2="261" filter="url(#hp-glow)"/>
<text class="hp-f" x="80" y="424">signal integrity 98.2%</text>
</svg>
