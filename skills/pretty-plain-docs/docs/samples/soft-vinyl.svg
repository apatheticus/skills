<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Soft vinyl — Source, Transform, Store</title>
<desc>Five soft-touch vinyl primitives composing a pipeline figure. Three label-bearing slabs read Source on an event stream, Transform doing map and filter, and Store to a warehouse, joined left to right by two capsule connectors; a numbered sphere badge sits on each slab. Below, a five-cylinder series labelled Q1 through Q5 stands at relative heights 48, 72, 40, 80 and 60, so Q4 is tallest and Q3 shortest. Every form is lit from a single upper-left key, its shadow edge glowing warm rather than going dark, and each rests on a warm brown contact shadow offset along that light. Nothing moves: the figure is a single moulded take.</desc>
