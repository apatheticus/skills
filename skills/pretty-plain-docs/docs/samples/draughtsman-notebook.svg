<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Draughtsman notebook — Source, Transform, Store</title>
<desc>Precise 2H pencil work on squared notebook stock: centre lines, dashed hidden edges, dimensioned witness lines and light section hatching, all faintly hand-wavering.</desc>
<defs>
  <filter id="dn-a" data-style="draughtsman-notebook" x="-10%" y="-18%" width="120%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="3" seed="17" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="dn-g" data-style="draughtsman-notebook" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7 0.7" numOctaves="2" seed="31"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
  </filter>
</defs>
<style>
svg { --ground:#EFEBE1; --ink:#26262A; --muted:#4C4C52; --graphite:#5A5A62; --faint:#A7A091; --accent:#6B4A2A; --panel:#F6F3EA; }
  .dn-h { font: 400 36px "Times New Roman", Georgia, serif; fill: var(--ink); letter-spacing: 2px; }
  .dn-t { font: 400 24px "Times New Roman", Georgia, serif; fill: var(--ink); letter-spacing: 1px; }
  .dn-s { font: italic 400 19px "Times New Roman", Georgia, serif; fill: var(--muted); }
  .dn-f { font: 400 16px "Times New Roman", Georgia, serif; fill: var(--muted); }
  .dn-b { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .dn-l { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
  .dn-c { stroke: var(--faint); stroke-width: 1; fill: none; }
  .dn-hid { stroke: var(--graphite); stroke-width: 1.2; stroke-dasharray: 7 5; fill: none; }
  .dn-p { fill: var(--accent); opacity: 0; }
</style>
