<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Editorial — Source, Transform, Store</title>
<desc>A three-column page in Times on warm paper: rules above and below, roman section marks, and a slow pulsing red mark on each section head.</desc>
<defs>

</defs>
<style>
svg { --ground:#FBF7EF; --ink:#1A1A18; --muted:#5C5750; --rule:#CFC7B8; --accent:#8C2F1D; --surface:#FFFFFF; }
  .ed-k { font: italic 400 19px Georgia, serif; fill: var(--accent); letter-spacing: 1.6px; }
  .ed-h { font: 400 54px "Times New Roman", Georgia, serif; fill: var(--ink); }
  .ed-n { font: 400 20px Georgia, serif; fill: var(--muted); letter-spacing: 3px; }
  .ed-t { font: 700 24px Georgia, serif; fill: var(--ink); }
  .ed-s { font: italic 400 19px Georgia, serif; fill: var(--muted); }
  .ed-f { font: 400 16px Georgia, serif; fill: var(--muted); letter-spacing: 1px; }
  .ed-r { stroke: var(--rule); stroke-width: 1; }
  .ed-rule { stroke: var(--ink); stroke-width: 2; }
  .ed-link { stroke: var(--ink); stroke-width: 1.5; }
  .ed-mark { fill: var(--accent); }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<text class="ed-k" x="80" y="52">De Fluxu Datorum</text>
<line class="ed-rule" x1="80" y1="68" x2="1120" y2="68"/>
<text class="ed-h" x="80" y="128">The Passage of Data</text>
<line class="ed-r" x1="80" y1="150" x2="1120" y2="150"/>
<line class="ed-r" x1="253" y1="150" x2="253" y2="392"/>
