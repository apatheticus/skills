<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Codex study — Source, Transform, Store</title>
<desc>An invention study in iron-gall ink on vellum: cross-hatched boxes, a hand-ruled heading and mirrored marginalia at the right, marked decorative so it stays out of the meaning path.</desc>
<defs>
  <filter id="cx-a" data-style="codex-leonardo" x="-10%" y="-18%" width="120%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.024" numOctaves="3" seed="15" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4.0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="cx-g" data-style="codex-leonardo" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.66 0.66" numOctaves="3" seed="37"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .2 0"/>
  </filter>
</defs>
<style>
svg { --ground:#E8DCC0; --vellum:#DED0AE; --ink:#3B2A16; --muted:#5A452A; --sepia:#7A5C34; --red:#8C3A1E; --panel:#E2D5B6; }
  .cx-h { font: italic 400 38px "Bookman Old Style", Georgia, serif; fill: var(--ink); }
  .cx-t { font: 400 24px "Bookman Old Style", Georgia, serif; fill: var(--ink); }
  .cx-s { font: italic 400 19px Georgia, serif; fill: var(--muted); }
  .cx-f { font: italic 400 18px Georgia, serif; fill: var(--sepia); }
  .cx-b { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .cx-l { stroke: var(--sepia); stroke-width: 1.2; fill: none; }
  .cx-p { fill: var(--red); opacity: 0; }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<text class="cx-h" x="80" y="84">De Motu Datorum</text>
<line class="cx-l" x1="80" y1="98" x2="520" y2="98" filter="url(#cx-a)"/>
<g transform="translate(1120,140) scale(-1,1)" aria-hidden="true">
  <text class="cx-f" x="0" y="0">nota bene — il flusso non si ferma</text>
  <text class="cx-f" x="0" y="26">ogni cosa scorre</text>
</g>
<rect x="80" y="180" width="300" height="150" rx="4" fill="var(--panel)" filter="url(#cx-a)"/>
