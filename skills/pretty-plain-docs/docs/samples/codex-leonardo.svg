<text class="cx-f" x="832" y="210">iii</text>
<g data-bg="var(--panel)">
  <text class="cx-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="cx-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--panel)">
  <text class="cx-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="cx-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--panel)">
  <text class="cx-t" x="970" y="258" text-anchor="middle">Store</text>
  <text class="cx-s" x="970" y="288" text-anchor="middle">warehouse</text>
</g>
<line class="cx-b" x1="380" y1="261" x2="450" y2="261" filter="url(#cx-a)"/>
<path class="cx-b" d="M439 256 L450 261 L439 266" filter="url(#cx-a)"/>
<line class="cx-b" x1="750" y1="261" x2="820" y2="261" filter="url(#cx-a)"/>
<path class="cx-b" d="M809 256 L820 261 L809 266" filter="url(#cx-a)"/>
<circle class="cx-p" cx="386" cy="261" r="5"/>
<text class="cx-f" x="80" y="416">carta 31 recto — inchiostro ferrogallico</text>
<rect x="0" y="0" width="1200" height="460" filter="url(#cx-g)" style="mix-blend-mode:multiply"/>
</svg>
