<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--steel)" data-specimen="true">
<title>Brushed metal — Source, Transform, Store</title>
<desc>An anodised panel with a vertical tonal break, corner screw bosses, milled slots and engraved channel labels. The grain is a highly anisotropic turbulence field.</desc>
<defs>
  <linearGradient id="bm-face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--steellt)"/>
    <stop offset="0.46" stop-color="var(--steel)"/>
    <stop offset="0.54" stop-color="var(--face)"/>
    <stop offset="1" stop-color="var(--steeldk)"/>
  </linearGradient>
  <filter id="bm-g" data-style="brushed-metal" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.6 0.006" numOctaves="2" seed="4"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
  </filter>
  <filter id="bm-g2" data-style="brushed-metal" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.9 0.004" numOctaves="2" seed="61"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
  </filter>
</defs>
<style>
svg { --ground:#2A2D31; --steel:#9AA0A6; --steeldk:#5E646A; --steellt:#C9CED3; --face:#8A9096; --ink:#15181B; --engrave:#15181B; --brass:#C9A227; --led:#4ADE80; }
  .bm-h { font: 700 38px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 6px; }
  .bm-t { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 3px; }
  .bm-s { font: 400 19px "Helvetica Neue", Arial, sans-serif; fill: var(--engrave); }
  .bm-f { font: 400 16px "Helvetica Neue", Arial, sans-serif; fill: var(--steellt); letter-spacing: 2px; }
  .bm-e { fill: none; stroke: var(--steeldk); stroke-width: 1.4; }
  .bm-hi { fill: none; stroke: var(--steellt); stroke-width: 1; opacity: .7; }
  .bm-led { fill: var(--led); }
</style>
