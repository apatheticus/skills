  .bn-e { font: 600 16px "Helvetica Neue", Arial, sans-serif; fill: var(--eyebrow); letter-spacing: 1.6px; }
  .bn-t { font: 700 25px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .bn-s { font: 400 19px "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
  .bn-n { font: 700 34px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
