<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Bento grid — Source, Transform, Store</title>
<desc>A dashboard of rounded tiles on a single 16-unit gutter: one large focal cell carrying the headline figure and a growing bar chart, and four supporting cells on the right.</desc>
