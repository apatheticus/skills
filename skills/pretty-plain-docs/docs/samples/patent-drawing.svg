  <text class="pd-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="pd-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--ground)">
  <text class="pd-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="pd-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--ground)">
  <text class="pd-t" x="970" y="258" text-anchor="middle">Store</text>
