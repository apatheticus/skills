<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Patent drawing — Source, Transform, Store</title>
<desc>A formal disclosure figure: fine black line work on near-white, section hatching under each element, numbered lead lines and a sheet caption. A small dot indexes along the linkage.</desc>
<defs>
  <filter id="pd-a" data-style="patent-drawing" x="-10%" y="-18%" width="120%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="pd-b" data-style="patent-drawing" x="-10%" y="-18%" width="120%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.024" numOctaves="2" seed="23" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<style>
svg { --ground:#FCFCFA; --ink:#141414; --muted:#3A3A3A; --hatch:#6E6E6E; }
  .pd-h { font: 400 34px "Times New Roman", Georgia, serif; fill: var(--ink); letter-spacing: 3px; }
  .pd-t { font: 400 23px "Times New Roman", Georgia, serif; fill: var(--ink); letter-spacing: 1px; }
  .pd-s { font: italic 400 19px "Times New Roman", Georgia, serif; fill: var(--muted); }
  .pd-n { font: 400 20px "Times New Roman", Georgia, serif; fill: var(--ink); }
  .pd-f { font: 400 16px "Times New Roman", Georgia, serif; fill: var(--muted); letter-spacing: 1px; }
  .pd-b { fill: none; stroke: var(--ink); stroke-width: 2; }
  .pd-l { stroke: var(--ink); stroke-width: 1.4; fill: none; }
  .pd-hatch { stroke: var(--hatch); stroke-width: 1; }
  .pd-lead { stroke: var(--ink); stroke-width: 1; fill: none; }
  .pd-p { fill: var(--ink); opacity: 0; }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<text class="pd-h" x="600" y="76" text-anchor="middle">FIG. 3</text>
<line class="pd-l" x1="80" y1="96" x2="1120" y2="96" filter="url(#pd-b)"/>
<rect class="pd-b" x="80" y="180" width="300" height="150" rx="2" filter="url(#pd-a)"/>
<line class="pd-l" x1="80" y1="222" x2="380" y2="222" filter="url(#pd-b)"/>
