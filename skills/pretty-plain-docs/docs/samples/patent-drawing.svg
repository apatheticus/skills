<text class="pd-f" data-role="metadata" x="80" y="416">SHEET 3 OF 7 — APPARATUS FOR CONVEYING DATA</text>
<text class="pd-f" data-role="metadata" x="1120" y="416" text-anchor="end">ATTY DKT. 031-A</text>
</svg>
