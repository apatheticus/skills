</defs>
<style>
svg { --ground:#FAFAF6; --ink:#16181C; --muted:#42464E; --wire:#16181C; --hot:#B03A2E; --cold:#1F618D; --panel:#F0F0EA; --rule:#B9BCC2; }
  .sc-h { font: 400 32px ui-monospace, Menlo, monospace; fill: var(--ink); letter-spacing: 2px; }
