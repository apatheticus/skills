<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Schematic — Source, Transform, Store</title>
<desc>A drawn circuit sheet: ruled border, reference designators, pin stubs with junction dots, a supply rail and a ground symbol. A red carrier travels the signal path.</desc>
