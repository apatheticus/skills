  .sc-s { font: 400 19px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .sc-f { font: 400 17px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .sc-w { fill: none; stroke: var(--wire); stroke-width: 1.8; }
  .sc-b { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .sc-r { stroke: var(--rule); stroke-width: 1.5; }
  .sc-p { fill: var(--hot); opacity: 0; }
</style>
