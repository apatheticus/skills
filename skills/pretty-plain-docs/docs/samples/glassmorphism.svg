<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Glassmorphism — Source, Transform, Store</title>
<desc>Frosted panels over drifting colour blobs on deep navy. The field blurs at 34 and the frost at 14, and each panel carries a tint so the type keeps its contrast.</desc>
<defs>
  <filter id="gl-field" data-style="glassmorphism" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="34"/>
  </filter>
  <filter id="gl-frost" data-style="glassmorphism" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <linearGradient id="gl-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="var(--edge)" stop-opacity=".85"/>
    <stop offset="0.5" stop-color="var(--edge)" stop-opacity=".18"/>
    <stop offset="1" stop-color="var(--edge)" stop-opacity=".6"/>
  </linearGradient>
</defs>
<style>
svg { --ground:#1B2140; --blob1:#7C4DFF; --blob2:#00BFA5; --blob3:#FF4081; --ink:#FFFFFF; --muted:#E6EAFF; --edge:#FFFFFF; --panel:#2A3160; }
  .gl-h { font: 600 40px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .gl-t { font: 600 25px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
  .gl-s { font: 400 19px "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
  .gl-f { font: 400 18px "Helvetica Neue", Arial, sans-serif; fill: var(--muted); }
  .gl-e { fill: none; stroke: url(#gl-edge); stroke-width: 1.6; }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<g filter="url(#gl-field)">
  <circle class="gl-d" cx="260" cy="180" r="150" fill="var(--blob1)"/>
  <circle cx="640" cy="360" r="170" fill="var(--blob2)"/>
  <circle class="gl-d" cx="1010" cy="150" r="140" fill="var(--blob3)"/>
</g>
<text class="gl-h" x="80" y="92">Frosted flow</text>
<text class="gl-f" x="80" y="126">panels tinted so the type still reads</text>
<rect x="80" y="180" width="300" height="150" rx="20" fill="var(--panel)" opacity=".82" filter="url(#gl-frost)"/>
<rect x="80" y="180" width="300" height="150" rx="20" fill="var(--panel)" opacity=".55"/>
<rect class="gl-e" x="80" y="180" width="300" height="150" rx="20"/>
<rect x="98" y="198" width="264" height="2" rx="1" fill="var(--edge)" opacity=".3"/>
<text class="gl-f" x="100" y="224">01</text>
<rect x="100" y="296" width="260" height="10" rx="5" fill="var(--edge)" opacity=".22"/>
<rect x="450" y="180" width="300" height="150" rx="20" fill="var(--panel)" opacity=".82" filter="url(#gl-frost)"/>
<rect x="450" y="180" width="300" height="150" rx="20" fill="var(--panel)" opacity=".55"/>
<rect class="gl-e" x="450" y="180" width="300" height="150" rx="20"/>
<rect x="468" y="198" width="264" height="2" rx="1" fill="var(--edge)" opacity=".3"/>
<text class="gl-f" x="470" y="224">02</text>
<rect x="470" y="296" width="260" height="10" rx="5" fill="var(--edge)" opacity=".22"/>
<rect x="820" y="180" width="300" height="150" rx="20" fill="var(--panel)" opacity=".82" filter="url(#gl-frost)"/>
<rect x="820" y="180" width="300" height="150" rx="20" fill="var(--panel)" opacity=".55"/>
<rect class="gl-e" x="820" y="180" width="300" height="150" rx="20"/>
<rect x="838" y="198" width="264" height="2" rx="1" fill="var(--edge)" opacity=".3"/>
<text class="gl-f" x="840" y="224">03</text>
<rect x="840" y="296" width="260" height="10" rx="5" fill="var(--edge)" opacity=".22"/>
<g data-bg="var(--panel)">
  <text class="gl-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="gl-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--panel)">
  <text class="gl-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="gl-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--panel)">
  <text class="gl-t" x="970" y="258" text-anchor="middle">Store</text>
  <text class="gl-s" x="970" y="288" text-anchor="middle">warehouse</text>
</g>
<rect x="380" y="257" width="70" height="10" rx="5" fill="var(--edge)" opacity=".5"/>
<rect x="750" y="257" width="70" height="10" rx="5" fill="var(--edge)" opacity=".5"/>
<rect x="80" y="366" width="1040" height="62" rx="24" fill="var(--panel)" opacity=".55"/>
<rect class="gl-e" x="80" y="366" width="1040" height="62" rx="24"/>
<text class="gl-f" x="106" y="404">two blur tiers: field 34, frost 14</text>
<circle cx="1000" cy="397" r="8" fill="var(--edge)" opacity="0.20"/>
<circle cx="1026" cy="397" r="8" fill="var(--edge)" opacity="0.36"/>
<circle cx="1052" cy="397" r="8" fill="var(--edge)" opacity="0.52"/>
<circle cx="1078" cy="397" r="8" fill="var(--edge)" opacity="0.68"/>
</svg>
