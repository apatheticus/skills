<g data-bg="var(--sanded)"><text class="wg-s" x="842" y="218">no. 3</text></g>
<line class="wg-r" x1="840" y1="290" x2="1100" y2="290" filter="url(#wg-a)"/>
<line class="wg-r" x1="840" y1="297" x2="1100" y2="297" filter="url(#wg-a)"/>
<line class="wg-r" x1="840" y1="304" x2="1100" y2="304" filter="url(#wg-a)"/>
<line class="wg-r" x1="840" y1="311" x2="1100" y2="311" filter="url(#wg-a)"/>
