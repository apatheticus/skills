<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--timber)" data-specimen="true">
<title>Wood grain — Source, Transform, Store</title>
<desc>Three sanded oak plates set into a plank whose growth rings are displaced by a directional turbulence field, with pyrographed labels and brass pins.</desc>
<defs>
  <filter id="wg-a" data-style="wood-grain" x="-10%" y="-18%" width="120%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.055" numOctaves="4" seed="8" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wg-g" data-style="wood-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="3" seed="26"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
  </filter>
</defs>
<style>
svg { --ground:#6B4423; --timber:#8A5C31; --timberdk:#4A2D15; --sanded:#C9A678; --ink:#2E1B0C; --muted:#4A2D15; --burn:#3A2110; --brass:#B98A3C; --reversed:#F4ECE0; }
  .wg-h { font: 400 40px "Bookman Old Style", Georgia, serif; fill: var(--reversed); letter-spacing: 3px; }
  .wg-t { font: 700 25px "Bookman Old Style", Georgia, serif; fill: var(--ink); letter-spacing: 1px; }
  .wg-s { font: italic 400 19px Georgia, serif; fill: var(--muted); }
  .wg-f { font: 400 18px Georgia, serif; fill: var(--reversed); }
  .wg-r { stroke: var(--timberdk); stroke-width: 1.4; fill: none; opacity: .55; }
  .wg-p { fill: var(--brass); opacity: 0; }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--timber)"/>
<line class="wg-r" x1="0" y1="6" x2="1200" y2="6" filter="url(#wg-a)"/>
<line class="wg-r" x1="0" y1="24" x2="1200" y2="24" filter="url(#wg-a)"/>
