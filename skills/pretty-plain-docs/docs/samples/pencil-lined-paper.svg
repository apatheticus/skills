<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="0" data-bg="var(--ground)" data-specimen="true">
<title>Pencil on lined paper — Source, Transform, Store</title>
<desc>Graphite boxes sketched on ruled legal-pad stock with a double red margin rule, hatched shading and a note scrawled at the foot of the page.</desc>
<defs>
  <filter id="pl-a" data-style="pencil-lined-paper" x="-10%" y="-18%" width="120%" height="136%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.026" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="pl-g" data-style="pencil-lined-paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8 0.8" numOctaves="2" seed="21"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
  </filter>
</defs>
<style>
svg { --ground:#FCFAF0; --ruled:#AFC4DC; --margin:#D98C9A; --ink:#3A3A40; --muted:#5C5C64; --graphite:#6A6A72; --panel:#F2EFE4; }
  .pl-h { font: 400 38px "Bradley Hand", "Segoe Script", cursive; fill: var(--ink); }
  .pl-t { font: 400 25px "Bradley Hand", "Segoe Script", cursive; fill: var(--ink); }
  .pl-s { font: 400 19px "Bradley Hand", "Segoe Script", cursive; fill: var(--muted); }
  .pl-f { font: 400 16px "Bradley Hand", "Segoe Script", cursive; fill: var(--muted); }
  .pl-b { fill: none; stroke: var(--graphite); stroke-width: 2; }
  .pl-r { stroke: var(--ruled); stroke-width: 1.2; }
  .pl-m { stroke: var(--margin); stroke-width: 1.6; }
  .pl-p { fill: var(--graphite); opacity: 0; }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<line class="pl-r" x1="0" y1="60" x2="1200" y2="60"/>
<line class="pl-r" x1="0" y1="94" x2="1200" y2="94"/>
<line class="pl-r" x1="0" y1="128" x2="1200" y2="128"/>
<line class="pl-r" x1="0" y1="162" x2="1200" y2="162"/>
<line class="pl-r" x1="0" y1="196" x2="1200" y2="196"/>
<line class="pl-r" x1="0" y1="230" x2="1200" y2="230"/>
<line class="pl-r" x1="0" y1="264" x2="1200" y2="264"/>
<line class="pl-r" x1="0" y1="298" x2="1200" y2="298"/>
<line class="pl-r" x1="0" y1="332" x2="1200" y2="332"/>
<line class="pl-r" x1="0" y1="366" x2="1200" y2="366"/>
<line class="pl-r" x1="0" y1="400" x2="1200" y2="400"/>
<line class="pl-r" x1="0" y1="434" x2="1200" y2="434"/>
<line class="pl-m" x1="52" y1="0" x2="52" y2="460"/>
<line class="pl-m" x1="58" y1="0" x2="58" y2="460"/>
<text class="pl-h" x="80" y="88">how it flows</text>
<text class="pl-f" data-role="metadata" x="80" y="120">scribbled in the margin</text>
<rect x="80" y="180" width="300" height="150" rx="4" fill="var(--panel)" filter="url(#pl-a)"/>
<rect class="pl-b" x="80" y="180" width="300" height="150" rx="4" filter="url(#pl-a)"/>
<line class="pl-b" x1="92" y1="222" x2="368" y2="222" filter="url(#pl-a)"/>
<text class="pl-f" data-role="metadata" x="92" y="210">1)</text>
<line class="pl-b" x1="96" y1="296" x2="306" y2="296" opacity=".45" filter="url(#pl-a)"/>
<line class="pl-b" x1="96" y1="307" x2="276" y2="307" opacity=".45" filter="url(#pl-a)"/>
<line class="pl-b" x1="96" y1="318" x2="246" y2="318" opacity=".45" filter="url(#pl-a)"/>
<rect x="450" y="180" width="300" height="150" rx="4" fill="var(--panel)" filter="url(#pl-a)"/>
<rect class="pl-b" x="450" y="180" width="300" height="150" rx="4" filter="url(#pl-a)"/>
<line class="pl-b" x1="462" y1="222" x2="738" y2="222" filter="url(#pl-a)"/>
<text class="pl-f" data-role="metadata" x="462" y="210">2)</text>
<line class="pl-b" x1="466" y1="296" x2="676" y2="296" opacity=".45" filter="url(#pl-a)"/>
<line class="pl-b" x1="466" y1="307" x2="646" y2="307" opacity=".45" filter="url(#pl-a)"/>
<line class="pl-b" x1="466" y1="318" x2="616" y2="318" opacity=".45" filter="url(#pl-a)"/>
<rect x="820" y="180" width="300" height="150" rx="4" fill="var(--panel)" filter="url(#pl-a)"/>
<rect class="pl-b" x="820" y="180" width="300" height="150" rx="4" filter="url(#pl-a)"/>
<line class="pl-b" x1="832" y1="222" x2="1108" y2="222" filter="url(#pl-a)"/>
<text class="pl-f" data-role="metadata" x="832" y="210">3)</text>
<line class="pl-b" x1="836" y1="296" x2="1046" y2="296" opacity=".45" filter="url(#pl-a)"/>
<line class="pl-b" x1="836" y1="307" x2="1016" y2="307" opacity=".45" filter="url(#pl-a)"/>
<line class="pl-b" x1="836" y1="318" x2="986" y2="318" opacity=".45" filter="url(#pl-a)"/>
<g data-bg="var(--panel)">
  <text class="pl-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="pl-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--panel)">
  <text class="pl-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="pl-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--panel)">
  <text class="pl-t" x="970" y="258" text-anchor="middle">Store</text>
  <text class="pl-s" x="970" y="288" text-anchor="middle">warehouse</text>
</g>
<line class="pl-b" x1="380" y1="261" x2="450" y2="261" filter="url(#pl-a)"/>
<path class="pl-b" d="M439 256 L450 261 L439 266" filter="url(#pl-a)"/>
<line class="pl-b" x1="750" y1="261" x2="820" y2="261" filter="url(#pl-a)"/>
<path class="pl-b" d="M809 256 L820 261 L809 266" filter="url(#pl-a)"/>
<circle class="pl-p" cx="386" cy="261" r="6"/>
<text class="pl-f" data-role="metadata" x="80" y="418">— check this against the schema</text>
<rect x="0" y="0" width="1200" height="460" filter="url(#pl-g)" style="mix-blend-mode:multiply"/>
</svg>
