<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="12" data-bg="var(--ground)" data-specimen="true">
<title>Heads-up display — Source, Transform, Store</title>
<desc>A targeting overlay on a fine grid: bracketed reticle corners on every node, tick scales, concentric range rings and a sweep hand rotating once per six seconds.</desc>
<defs>
  <filter id="hd-glow" data-style="hud" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="g"/>
    <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
svg { --ground:#04121A; --cyan:#22D3EE; --cyandk:#0E7490; --amber:#FBBF24; --ink:#CFFAFE; --muted:#7DD3FC; --grid:#0B2A38; --panel:#07202C; --red:#FB7185; }
  .hd-h { font: 500 30px ui-monospace, Menlo, monospace; fill: var(--cyan); letter-spacing: 4px; }
  .hd-t { font: 500 24px ui-monospace, Menlo, monospace; fill: var(--ink); letter-spacing: 2px; }
  .hd-s { font: 400 19px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .hd-f { font: 400 17px ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 1px; }
  .hd-l { fill: none; stroke: var(--cyan); stroke-width: 1.4; }
  .hd-g { stroke: var(--grid); stroke-width: 1; }
  .hd-tick { stroke: var(--cyandk); stroke-width: 1.4; }
  .hd-sweep { animation: hd-sweep 6s linear infinite; transform-origin: 600px 255px; }
  @keyframes hd-sweep { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  .hd-bl { animation: hd-bl 2s steps(2, end) infinite; }
  @keyframes hd-bl { 0%,49% { opacity: 1 } 50%,100% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .hd-sweep, .hd-bl { animation: none; opacity: 1 } }
</style>
