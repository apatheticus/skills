svg { --ground:#08080C; --orange:#FF9C3F; --rose:#D98BB0; --peri:#9FA8FF; --gold:#FFCB6B; --ink:#0A0A0E; --panelink:#F2E7DA; --muted:#C8B9A8; --bar:#3A2A18; }
  .ce-h { font: 700 34px "Helvetica Neue", Arial, sans-serif; fill: var(--orange); letter-spacing: 4px; }
  .ce-t { font: 700 24px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 2px; }
  .ce-s { font: 400 19px "Helvetica Neue", Arial, sans-serif; fill: var(--bar); }
  .ce-f { font: 700 18px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 2px; }
  .ce-n { font: 700 18px "Helvetica Neue", Arial, sans-serif; fill: var(--panelink); letter-spacing: 2px; }
  .ce-bl { animation: ce-bl 4s steps(2, end) infinite; }
  @keyframes ce-bl { 0%,49% { opacity: 1 } 50%,100% { opacity: .4 } }
  @media (prefers-reduced-motion: reduce) { .ce-bl { animation: none; opacity: 1 } }
</style>
