<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">security-audit-full-report</title>
  <desc id="desc">A Claude Code agent skill that loops a security audit until findings converge, then merges every run into one consolidated, interactive HTML report.</desc>

  <rect width="1200" height="340" rx="24" fill="#0A0C13"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="2.5" fill="#F0879A">CLAUDE CODE &#183; AGENT SKILL</text>
    <text x="62" y="144" font-size="52" font-weight="700" letter-spacing="-1"
          fill="#F2F4FB">security-audit-full-report</text>
    <text x="64" y="184" font-size="20" fill="#AEB4C9">Loop a security audit until findings converge,</text>
    <text x="64" y="211" font-size="20" fill="#AEB4C9">then merge every run into one consolidated,</text>
    <text x="64" y="238" font-size="20" fill="#AEB4C9">interactive HTML report.</text>

    <g id="chips" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <rect x="64" y="258" width="150" height="32" rx="16" fill="#131726" stroke="#2A2F45"/>
      <text x="139" y="279" text-anchor="middle" fill="#AEB4C9">stateful loop</text>
      <rect x="228" y="258" width="190" height="32" rx="16" fill="#131726" stroke="#2A2F45"/>
      <text x="323" y="279" text-anchor="middle" fill="#AEB4C9">resumable ledger.md</text>
      <rect x="432" y="258" width="196" height="32" rx="16" fill="#131726" stroke="#2A2F45"/>
      <text x="530" y="279" text-anchor="middle" fill="#AEB4C9">runs to convergence</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(690 42)">
    <rect width="450" height="256" rx="16" fill="#10131D" stroke="#262C45" stroke-width="1.5"/>

    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="2" fill="#F0879A">SECURITY AUDIT</text>
    <rect x="322" y="10" width="108" height="24" rx="12" fill="#152B22"/>
    <text x="376" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#5FE0AE">converged</text>
    <line x1="20" y1="48" x2="430" y2="48" stroke="#1E2338"/>

    <g id="severity-donut" transform="translate(78 138)">
      <circle r="46" fill="none" stroke="#1E2338" stroke-width="16"/>
      <circle r="46" fill="none" stroke="#EF4458" stroke-width="16"
              stroke-dasharray="72 289" transform="rotate(-90)"/>
      <circle r="46" fill="none" stroke="#F9A03F" stroke-width="16"
              stroke-dasharray="101 289" stroke-dashoffset="-72" transform="rotate(-90)"/>
      <circle r="46" fill="none" stroke="#3B82F6" stroke-width="16"
              stroke-dasharray="116 289" stroke-dashoffset="-173" transform="rotate(-90)"/>
      <text y="-2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
            font-size="30" font-weight="700" fill="#F2F4FB">23</text>
      <text y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace"
            font-size="11" letter-spacing="1" fill="#6E7591">FINDINGS</text>
    </g>

    <g id="severity-legend" font-family="-apple-system, BlinkMacSystemFont, sans-serif" transform="translate(198 78)">
      <rect x="0" y="0" width="10" height="10" rx="2" fill="#EF4458"/>
      <text x="20" y="9" font-size="14" fill="#C7CCDE">High</text>
      <text x="212" y="9" font-size="14" font-weight="700" text-anchor="end" fill="#F2F4FB">5</text>
      <rect x="0" y="34" width="10" height="10" rx="2" fill="#F9A03F"/>
      <text x="20" y="43" font-size="14" fill="#C7CCDE">Medium</text>
      <text x="212" y="43" font-size="14" font-weight="700" text-anchor="end" fill="#F2F4FB">7</text>
      <rect x="0" y="68" width="10" height="10" rx="2" fill="#3B82F6"/>
      <text x="20" y="77" font-size="14" fill="#C7CCDE">Low</text>
      <text x="212" y="77" font-size="14" font-weight="700" text-anchor="end" fill="#F2F4FB">11</text>
      <line x1="0" y1="96" x2="212" y2="96" stroke="#1E2338"/>
      <text x="0" y="118" font-size="13" fill="#8A8FF5">3 cycles</text>
      <text x="212" y="118" font-size="13" text-anchor="end" fill="#8A8FF5">4 runs merged</text>
    </g>

    <g id="cycle-strip" transform="translate(20 210)" font-family="ui-monospace, Menlo, monospace" font-size="11">
      <text x="0" y="0" letter-spacing="1.5" fill="#6E7591">CONVERGENCE</text>
      <circle cx="8" cy="24" r="8" fill="#EF4458"/>
      <text x="8" y="27" text-anchor="middle" font-size="9" fill="#0A0C13">1</text>
      <line x1="18" y1="24" x2="66" y2="24" stroke="#2A2F45" stroke-width="2"/>
      <circle cx="76" cy="24" r="8" fill="#F9A03F"/>
      <text x="76" y="27" text-anchor="middle" font-size="9" fill="#0A0C13">2</text>
      <line x1="86" y1="24" x2="134" y2="24" stroke="#2A2F45" stroke-width="2"/>
      <circle cx="144" cy="24" r="8" fill="#2ECC9A"/>
      <text x="144" y="27" text-anchor="middle" font-size="9" fill="#0A0C13">3</text>
      <text x="176" y="28" font-size="12" fill="#5FE0AE">0 new med+ &#215;2 &#8594; stop</text>
    </g>
  </g>
</svg>
