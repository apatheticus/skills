<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"
     role="img" data-loop-s="12" data-bg="background">
  <title>security-audit-full-report — the loop stops itself, then writes one report</title>
  <desc>Four cycle cards run left to right, one security-audit run each, lit in turn. Run 1
and run 2 each add more than zero new medium-or-higher findings, so the convergence counter
resets to zero both times. Run 3 adds none and the counter reaches one; run 4 adds none and
the counter reaches two. A dark stop card on the right states the rule the ledger applies:
stop when the counter reaches two consecutive zero-new cycles, or when the run number
reaches max_cycles. Either way the loop ends and a single consolidated report is written
once, at the stop — every run merged into one HTML file, filterable by run, built from the
bundled template and traced back to each run's findings.json.</desc>

  <style>
    svg { --background:#F6F7FC; --surface:#FFFFFF; --surface-deep:#23265E;
          --ink:#12142B; --muted:#4C5273; --accent-primary:#5B5FEF;
          --high:#EF4458; --clean:#2ECC9A; --rule:#DDDFEB; }

    .bg    { fill: var(--background); }
    .card  { fill: var(--surface); filter: url(#e1); }
    .deep  { fill: var(--surface-deep); filter: url(#e1); }
    .band  { fill: var(--accent-primary); filter: url(#e1); }

    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

    .kick  { fill: var(--muted); font-size: 17px; font-weight: 700; letter-spacing: 2.4px; }
    .h     { fill: var(--ink);   font-size: 52px; font-weight: 700; letter-spacing: -1.2px; }
    .lede  { fill: var(--muted); font-size: 22px; font-weight: 400; }
    .sect  { fill: var(--muted); font-size: 17px; font-weight: 700; letter-spacing: 2.2px; }

    .run   { fill: var(--ink);   font-size: 21px; font-weight: 500; }
    .unit  { fill: var(--muted); font-size: 17px; font-weight: 500; }
    .big   { fill: var(--ink);   font-size: 30px; font-weight: 700; }

    .dlab  { fill: var(--rule);    font-size: 17px; font-weight: 700; letter-spacing: 2.2px; }
    .dval  { fill: var(--surface); font-size: 20px; font-weight: 500; }

    .btit  { fill: var(--surface); font-size: 26px; font-weight: 700; }
    .bsub  { fill: var(--surface); font-size: 19px; font-weight: 400; }
    .bmono { fill: var(--surface); font-size: 20px; font-weight: 500; }

    .conn  { fill: none; stroke: var(--accent-primary); stroke-width: 2; }
    .head  { fill: var(--accent-primary); }
    .found { fill: var(--high); }
    .zero  { fill: var(--clean); }

    /* one sequence: each cycle card is lit in turn, left to right. 12s is the loop,
       so the four negative delays are the same animation phase-shifted by 3s each. */
    .dot   { opacity: 1; animation: seq 12s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes seq { 0%,12% { opacity: .38 } 20%,28% { opacity: 1 } 36%,100% { opacity: .38 } }
    .d1 { animation-delay: 0s }
    .d2 { animation-delay: -9s }
    .d3 { animation-delay: -6s }
    .d4 { animation-delay: -3s }

    /* one ripple where the decision lands. It begins and ends invisible, so the
       reset is unseen; 3s divides the 12s loop four times. */
    .ripple { fill: var(--accent-primary); transform-box: view-box;
              transform-origin: 1040px 498px;
              animation: ripple 3s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ripple {
      0%   { transform: scale(.35); opacity: 0 }
      15%  { opacity: .5 }
      70%  { transform: scale(1.9); opacity: 0 }
      100% { transform: scale(.35); opacity: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot    { animation: none; opacity: 1 }
      .ripple { animation: none; opacity: 0 }
    }
  </style>

  <defs>
    <filter id="e1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="620"/>

  <text class="sans kick" x="64" y="84" data-role="metadata">ITERATIVE ASSESSMENT · ONE REPORT</text>
  <text class="sans h"    x="64" y="148" data-role="hero">security-audit-full-report</text>
  <text class="sans lede" x="64" y="196" data-role="essential">One security-audit run per cycle, each hunting the ground the last one missed.</text>
  <text class="sans lede" x="64" y="228" data-role="essential">The loop stops itself, and the report is written once — at the stop.</text>

  <text class="sans sect" x="64" y="288" data-role="metadata">CYCLE MODE · ledger.md DECIDES</text>

  <rect class="card" x="64" y="306" width="196" height="156" rx="8"/>
  <circle class="found dot d1" cx="230" cy="340" r="9"/>
  <text class="mono run"  x="86" y="348" data-bg="surface">run-1</text>
  <text class="sans unit" x="86" y="384" data-bg="surface" data-role="metadata">new med+</text>
  <text class="mono big"  x="86" y="420" data-bg="surface">&gt; 0</text>
  <text class="sans unit" x="86" y="448" data-bg="surface" data-role="metadata">counter → 0</text>

  <rect class="card" x="284" y="306" width="196" height="156" rx="8"/>
  <circle class="found dot d2" cx="450" cy="340" r="9"/>
  <text class="mono run"  x="306" y="348" data-bg="surface">run-2</text>
  <text class="sans unit" x="306" y="384" data-bg="surface" data-role="metadata">new med+</text>
  <text class="mono big"  x="306" y="420" data-bg="surface">&gt; 0</text>
  <text class="sans unit" x="306" y="448" data-bg="surface" data-role="metadata">counter → 0</text>

  <rect class="card" x="504" y="306" width="196" height="156" rx="8"/>
  <circle class="zero dot d3" cx="670" cy="340" r="9"/>
  <text class="mono run"  x="526" y="348" data-bg="surface">run-3</text>
  <text class="sans unit" x="526" y="384" data-bg="surface" data-role="metadata">new med+</text>
  <text class="mono big"  x="526" y="420" data-bg="surface">= 0</text>
  <text class="sans unit" x="526" y="448" data-bg="surface" data-role="metadata">counter → 1</text>

  <rect class="card" x="724" y="306" width="196" height="156" rx="8"/>
  <circle class="zero dot d4" cx="890" cy="340" r="9"/>
  <text class="mono run"  x="746" y="348" data-bg="surface">run-4</text>
  <text class="sans unit" x="746" y="384" data-bg="surface" data-role="metadata">new med+</text>
  <text class="mono big"  x="746" y="420" data-bg="surface">= 0</text>
  <text class="sans unit" x="746" y="448" data-bg="surface" data-role="metadata">counter → 2</text>

  <rect class="deep" x="944" y="306" width="192" height="156" rx="8"/>
  <text class="sans dlab" x="966" y="342" data-bg="surface-deep" data-role="metadata">STOP WHEN</text>
  <text class="mono dval" x="966" y="382" data-bg="surface-deep" data-role="essential">counter = 2</text>
  <text class="sans dlab" x="966" y="414" data-bg="surface-deep" data-role="metadata">OR</text>
  <text class="mono dval" x="966" y="448" data-bg="surface-deep" data-role="essential">run = max</text>

  <circle class="ripple" cx="1040" cy="498" r="22"/>
  <path class="conn" d="M1040 462 V488"/>
  <path class="head" d="M1040 500 l-8 -14 h16 Z"/>

  <rect class="band" x="64" y="498" width="1072" height="90" rx="8"/>
  <text class="sans btit"  x="88" y="536" data-bg="accent-primary">One consolidated report</text>
  <text class="sans bsub"  x="88" y="566" data-bg="accent-primary">every run merged · filterable by run · every claim traced to that run's findings.json</text>
  <text class="mono bmono" x="1112" y="546" text-anchor="end" data-bg="accent-primary" data-role="essential">assets/template.html</text>
</svg>
