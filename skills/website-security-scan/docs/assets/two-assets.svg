<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"
     width="1200" height="560" role="img" data-loop-s="0" data-bg="background">
  <title>A domain is not a system</title>
  <desc>One domain name fronts two assets with almost nothing in common. The website
  produces findings about headers, TLS, readable files and CMS disclosure, and what
  they cost depends on what the site holds. The DNS zone carries DMARC, SPF, DKIM and
  MTA-STS for corporate mail, where a weakness is aimed at whoever trusts the name.
  Isolating the website protects the zone from nothing, so email-authentication
  findings are reported first.</desc>

  <style>
    svg { --background:#F4F6FE; --surface:#FFFFFF; --ink:#12142B;
          --muted:#4C5273; --rule:#6A7091; --accent:#4A4AE8; }

    .bg    { fill: var(--background); }
    .card  { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
    .t     { fill: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .m     { fill: var(--muted); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono  { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .kick  { letter-spacing: 2.4px; }
    .folio { text-anchor: end; }
    .grid  { stroke: var(--rule); stroke-width: 1; fill: none; }
    .lead  { stroke: var(--accent); stroke-width: 2.5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="560"/>

  <text class="m kick"  x="64"   y="70"  font-size="18">ONE NAME, TWO ASSETS</text>
  <text class="t"       x="64"   y="130" font-size="48" font-weight="700"
        data-role="hero" letter-spacing="-1">A domain is not a system</text>
  <text class="m folio" x="1136" y="130" font-size="18">report them separately</text>

  <text class="mono"    x="64"   y="196" font-size="24" data-role="essential">example.com</text>
  <text class="m folio" x="1136" y="196" font-size="18">almost nothing in common</text>
  <line class="grid" x1="64" y1="214" x2="1136" y2="214"/>

  <g data-bg="surface">
    <rect class="card" x="64" y="246" width="1072" height="92"/>
    <text class="m kick" x="96" y="276" font-size="18">THE WEBSITE</text>
    <text class="t"      x="96" y="312" font-size="20" data-role="essential">Headers, TLS, readable files, CMS disclosure — what they cost depends on what the site holds</text>

    <rect class="card" x="64" y="358" width="1072" height="92"/>
    <text class="m kick" x="96" y="388" font-size="18">THE DNS ZONE</text>
    <text class="t"      x="96" y="424" font-size="20" data-role="essential">DMARC, SPF, DKIM and MTA-STS for corporate mail — a weakness here is aimed at whoever trusts the name</text>
  </g>

  <!-- the one accent on this board: the asset whose findings are reported first -->
  <line class="lead" x1="64" y1="358" x2="64" y2="450"/>

  <line class="grid" x1="64" y1="482" x2="1136" y2="482"/>
  <text class="m"       x="64"   y="510" font-size="18">isolating the site protects the zone from nothing</text>
  <text class="m folio" x="1136" y="510" font-size="18">email findings are reported first</text>
</svg>
