<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"
     width="1200" height="540" role="img" data-loop-s="12" data-bg="background">
  <title>Read-only, by construction</title>
  <desc>The scan sends DNS queries, HTTP GET and HEAD requests with a browser
  User-Agent, TLS handshakes, GETs of a fixed path list against the target's own
  vhost, and TCP connect plus banner reads. It never sends credentials or login
  attempts, payloads, injection, traversal or uploads, directory brute-forcing, or
  probes of other tenants on a shared IP. Nothing is authenticated, and every
  coverage gap is named in the report.</desc>

  <style>
    svg { --background:#F4F6FE; --ink:#12142B; --muted:#4C5273;
          --rule:#6A7091; --accent:#4A4AE8; }

    .bg    { fill: var(--background); }
    .t     { fill: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .m     { fill: var(--muted); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .kick  { letter-spacing: 2.4px; }
    .folio { text-anchor: end; }
    .grid  { stroke: var(--rule); stroke-width: 1; fill: none; }

    .flow  { stroke: var(--accent); stroke-width: 2.5; fill: none;
             stroke-dasharray: 28 432; animation: march 4s linear infinite; }
    @keyframes march { from { stroke-dashoffset: 460 } to { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="540"/>

  <text class="m kick"  x="64"   y="70"  font-size="18">THE BOUNDARY</text>
  <text class="t"       x="64"   y="130" font-size="48" font-weight="700"
        data-role="hero" letter-spacing="-1">Read-only, by construction</text>
  <text class="m folio" x="1136" y="130" font-size="18">connect-only on shared IPs</text>

  <line class="grid" x1="588" y1="196" x2="588" y2="430"/>

  <!-- left column: what leaves the machine. The accent rule is the only thing
       that moves, because it is the only side with traffic on it. -->
  <text class="m kick" x="64" y="214" font-size="18">SENT</text>
  <line class="grid" x1="64" y1="228" x2="524" y2="228"/>
  <line class="flow" x1="64" y1="228" x2="524" y2="228"/>

  <line class="grid" x1="64" y1="258" x2="76" y2="258"/>
  <text class="t" x="88" y="264" font-size="20" data-role="essential">DNS queries to three public resolvers</text>
  <line class="grid" x1="64" y1="294" x2="76" y2="294"/>
  <text class="t" x="88" y="300" font-size="20" data-role="essential">HTTP GET and HEAD, browser User-Agent</text>
  <line class="grid" x1="64" y1="330" x2="76" y2="330"/>
  <text class="t" x="88" y="336" font-size="20" data-role="essential">TLS handshakes</text>
  <line class="grid" x1="64" y1="366" x2="76" y2="366"/>
  <text class="t" x="88" y="372" font-size="20" data-role="essential">A fixed path list, target vhost only</text>
  <line class="grid" x1="64" y1="402" x2="76" y2="402"/>
  <text class="t" x="88" y="408" font-size="20" data-role="essential">TCP connect and banner read</text>

  <!-- right column: nothing leaves. Grey rule, no motion. -->
  <text class="m kick" x="616" y="214" font-size="18">NEVER SENT</text>
  <line class="grid" x1="616" y1="228" x2="1136" y2="228"/>

  <line class="grid" x1="616" y1="258" x2="628" y2="258"/>
  <text class="m" x="640" y="264" font-size="20" data-role="essential">Credentials, or any login attempt</text>
  <line class="grid" x1="616" y1="294" x2="628" y2="294"/>
  <text class="m" x="640" y="300" font-size="20" data-role="essential">Payloads, injection, traversal, uploads</text>
  <line class="grid" x1="616" y1="330" x2="628" y2="330"/>
  <text class="m" x="640" y="336" font-size="20" data-role="essential">Directory brute-forcing</text>
  <line class="grid" x1="616" y1="366" x2="628" y2="366"/>
  <text class="m" x="640" y="372" font-size="20" data-role="essential">Probes of other tenants on a shared IP</text>

  <line class="grid" x1="64" y1="452" x2="1136" y2="452"/>
  <text class="m"       x="64"   y="480" font-size="18">no authenticated testing, ever</text>
  <text class="m folio" x="1136" y="480" font-size="18">every gap is named in the report</text>
</svg>
