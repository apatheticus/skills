<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400"
     role="img" data-loop-s="12" data-bg="background">
  <title>more-pretty-docs — animated SVG, authored not rendered</title>
  <desc>A board of six cells. The project name and its one-line claim fill the widest
cell; a runtime cell reads python3; the focal cell reports zero dependencies. Along the
bottom row, three cells number the pipeline — author the svg, gate it until the checker
reports zero errors, commit that same file — and a status dot moves through them one at
a time. There is no render cell, because the committed asset is its own source.</desc>

  <style>
    svg { --background:#12324f; --surface:#17405f; --ink:#e8f2fb;
          --dim:#9fc4e8; --accent:#e0a33e; }

    .bg    { fill: var(--background); }
    .cell  { fill: var(--surface); stroke: var(--dim); stroke-width: 1; }
    .focal { fill: var(--accent); stroke: none; }

    .hero  { fill: var(--ink); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 48px; font-weight: 700; letter-spacing: -0.5px; }
    .lede  { fill: var(--dim); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 23px; font-weight: 600; }
    .lab   { fill: var(--dim); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 23px; font-weight: 600; }
    .lab-f { fill: var(--background); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 23px; font-weight: 600; }
    .val   { fill: var(--ink); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 46px; font-weight: 700; }
    .val-m { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 38px; font-weight: 700; }
    .val-f { fill: var(--background); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 64px; font-weight: 700; }
    .step  { fill: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 20px; font-weight: 700; letter-spacing: 1px; }

    /* motion — the grid is static; one cell reads live at a time.
       6s divides the 12s loop twice; the negative delays cost no extra time. */
    .dot { fill: var(--accent); animation: live 6s ease-in-out infinite; }
    .n1  { animation-delay: 0s; }
    .n2  { animation-delay: -2s; }
    .n3  { animation-delay: -4s; }
    @keyframes live { 0%, 66%, 100% { opacity: .2 } 12%, 33% { opacity: 1 } }

    .bar { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
           stroke-dasharray: 232; animation: fill 6s linear infinite; }
    @keyframes fill { 0% { stroke-dashoffset: 232 } 70%, 100% { stroke-dashoffset: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 1; }
      .bar { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="400"/>

  <!-- row 1 — col 0 span 3: the name -->
  <rect class="cell" x="40" y="40" width="550" height="150" rx="16" data-bg="surface"/>
  <text class="hero" x="72" y="112" data-role="hero" data-bg="surface">more-pretty-docs</text>
  <text class="lede" x="72" y="152" data-bg="surface">animated SVG, authored — not rendered</text>

  <!-- row 1 — col 3 span 2: the runtime -->
  <rect class="cell" x="610" y="40" width="360" height="150" rx="16" data-bg="surface"/>
  <text class="lab"   x="642" y="86"  data-bg="surface">Runtime</text>
  <text class="val-m" x="642" y="146" data-bg="surface">python3</text>

  <!-- row 1 — col 5 span 1: the focal cell, the one accent fill -->
  <rect class="focal" x="990" y="40" width="170" height="150" rx="16" data-bg="accent-primary"/>
  <text class="lab-f" x="1022" y="86"  data-bg="accent-primary">Deps</text>
  <text class="val-f" x="1022" y="158" data-bg="accent-primary">0</text>

  <!-- row 2 — the pipeline, one cell per station -->
  <rect class="cell" x="40" y="210" width="360" height="150" rx="16" data-bg="surface"/>
  <text class="step"  x="72" y="252" data-bg="surface">01 · AUTHOR</text>
  <text class="val-m" x="72" y="312" data-bg="surface">name.svg</text>
  <circle class="dot n1" cx="368" cy="243" r="9"/>

  <rect class="cell" x="420" y="210" width="360" height="150" rx="16" data-bg="surface"/>
  <text class="step"  x="452" y="252" data-bg="surface">02 · GATE</text>
  <text class="val"   x="452" y="312" data-bg="surface">0 errors</text>
  <circle class="dot n2" cx="748" cy="243" r="9"/>
  <line class="bar" x1="452" y1="336" x2="684" y2="336"/>

  <rect class="cell" x="800" y="210" width="360" height="150" rx="16" data-bg="surface"/>
  <text class="step"  x="832" y="252" data-bg="surface">03 · COMMIT</text>
  <text class="val-m" x="832" y="312" data-bg="surface">same file</text>
  <circle class="dot n3" cx="1128" cy="243" r="9"/>
</svg>
