<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060"
     role="img" data-loop-s="12" data-bg="background">
  <title>The 14-style catalog, each tile built in its own idiom</title>
  <desc>A drafted contact sheet of fourteen labelled tiles, one per catalog style: swiss-minimal,
flat-material, skeuomorphic, neumorphism, claymorphism, glassmorphism, neo-brutalist, editorial,
maximalist, y2k-retrofuturist, terminal-minimalist, blueprint, schematic and bento-grid. Each tile
is rendered in the style it names and carries one motion characteristic of that style. A note panel
states the rule: style owns form, while the product's own brand tokens still own the palette.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="var(--dim)" stroke-width="0.6" opacity="0.28"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--dim)"/>
    </marker>
    <filter id="mat" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <filter id="gblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="skeu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sw-metal)"/>
      <stop offset="1" stop-color="var(--sw-inkdark)"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sw-white)"/>
      <stop offset="0.34" stop-color="var(--sw-silver)"/>
      <stop offset="0.4" stop-color="var(--sw-white)"/>
      <stop offset="1" stop-color="var(--sw-inkdark)"/>
    </linearGradient>
    <clipPath id="y2kclip"><rect x="26" y="46" width="212" height="56"/></clipPath>
    <clipPath id="tileclip"><rect x="0" y="0" width="264" height="152"/></clipPath>
  </defs>

  <style>
    svg { --background:#12324f; --surface:#17405f; --ink:#e8f2fb;
          --dim:#9fc4e8; --accent:#e0a33e;
          --sw-paper:#f4f1ea;   --sw-inkdark:#14181d;  --sw-red:#d6452b;
          --sw-blue:#1e88e5;    --sw-white:#ffffff;    --sw-metal:#4a4f57;
          --sw-amber:#f0b429;   --sw-soft:#e8ecf2;     --sw-softshade:#b9c2ce;
          --sw-lilac:#c9b8ff;   --sw-pink:#ff9ec4;     --sw-violet:#7c3aed;
          --sw-cyan:#0ea5e9;    --sw-yellow:#ffd400;   --sw-black:#000000;
          --sw-orange:#ff4d3d;  --sw-cream:#fbf9f4;    --sw-rust:#8c2f1f;
          --sw-magenta:#ff2e88; --sw-teal:#00e5c0;     --sw-indigoviolet:#5b3df5;
          --sw-silver:#8fa6c4;  --sw-hotpink:#ff3fb4;  --sw-termbg:#0d1117;
          --sw-termgreen:#3fb950; --sw-offwhite:#f7f7f5; --sw-blue2:#1f6feb;
          --sw-lightgray:#f4f5f7; --sw-indigo:#3b5bdb; }

    .bg    { fill: var(--background); }
    .sheet { fill: url(#grid); }
    .panel { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
    .thin  { fill: none; stroke: var(--dim); stroke-width: 0.8; }
    .frame { fill: none; stroke: var(--dim); stroke-width: 0.8; }

    .title { fill: var(--ink); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 44px; font-weight: 700; letter-spacing: 1px; }
    .sub   { fill: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 21px; }
    .slug  { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 20px; }
    .stn   { fill: var(--ink); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 26px; font-weight: 700; letter-spacing: 1.2px; }
    .mono  { fill: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 19px; }
    .block { fill: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 18px; letter-spacing: .6px; }

    /* one motion per tile — 2s, 3s, 4s, 6s and 12s all divide the 12s loop */
    .march4 { stroke-dasharray: 18 200; animation: march 4s linear infinite; }
    @keyframes march { from { stroke-dashoffset: 218 } to { stroke-dashoffset: 0 } }

    .draw6 { stroke-dasharray: 600; animation: draw 6s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600 } 45%, 55% { stroke-dashoffset: 0 }
                      100% { stroke-dashoffset: -600 } }

    .scale4 { transform-box: fill-box; transform-origin: center;
              animation: ripple 4s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes ripple { 0% { transform: scale(.35); opacity: .6 }
                        70% { transform: scale(1.5); opacity: 0 }
                        100% { transform: scale(.35); opacity: 0 } }

    .pulse6 { animation: pulse 6s ease-in-out infinite; }
    .pulse3 { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

    .press6 { animation: press 6s cubic-bezier(.4,0,.4,1) infinite; }
    @keyframes press { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }

    .bob4 { transform-box: fill-box; transform-origin: center;
            animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) scale(1) }
                     50% { transform: translateY(-7px) scale(1.03) } }

    .drift12 { animation: drift 12s ease-in-out infinite; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0) }
                       50% { transform: translate(-22px, 14px) } }

    .nudge3 { animation: nudge 3s steps(1, end) infinite; }
    @keyframes nudge { 0%, 49% { transform: translate(0, 0) }
                       50%, 100% { transform: translate(6px, 6px) } }

    .spin6 { transform-box: fill-box; transform-origin: center;
             animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    .sweep6 { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(0) } 100% { transform: translateX(320px) } }

    .blink2 { animation: blink 2s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }

    .tok { fill: var(--sw-blue2); }

    @media (prefers-reduced-motion: reduce) {
      .march4, .draw6 { animation: none; stroke-dashoffset: 0; }
      .scale4, .pulse6, .pulse3, .press6, .bob4, .drift12,
      .nudge3, .spin6, .sweep6, .blink2 { animation: none; opacity: 1; }
      .tok { display: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="1060"/>
  <rect class="sheet" x="0" y="0" width="1200" height="1060"/>

  <text class="title" x="48" y="86" data-role="title">STYLE CATALOG</text>
  <text class="sub" x="48" y="120">fourteen idioms — --style &lt;slug&gt;, or derived from the product</text>
  <line class="thin" x1="48" y1="146" x2="1176" y2="146"/>

  <!-- row 1 -->
  <g transform="translate(48,176)" data-bg="sw-paper">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-paper)"/>
    <line x1="88" y1="0" x2="88" y2="152" stroke="var(--sw-inkdark)" stroke-width="1" stroke-opacity="0.16"/>
    <line x1="176" y1="0" x2="176" y2="152" stroke="var(--sw-inkdark)" stroke-width="1" stroke-opacity="0.16"/>
    <rect x="24" y="26" width="104" height="12" fill="var(--sw-inkdark)"/>
    <rect x="24" y="54" width="170" height="4" fill="var(--sw-inkdark)" fill-opacity="0.45"/>
    <rect x="24" y="66" width="140" height="4" fill="var(--sw-inkdark)" fill-opacity="0.45"/>
    <rect x="24" y="78" width="158" height="4" fill="var(--sw-inkdark)" fill-opacity="0.45"/>
    <line class="march4" x1="24" y1="120" x2="240" y2="120" stroke="var(--sw-red)" stroke-width="2.5"/>
  </g>
  <rect class="frame" x="48" y="176" width="264" height="152"/>
  <text class="slug" x="48" y="354">swiss-minimal</text>

  <g transform="translate(336,176)" data-bg="sw-blue">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-blue)"/>
    <rect x="24" y="26" width="216" height="100" rx="6" fill="var(--sw-white)" filter="url(#mat)"/>
    <rect x="44" y="48" width="96" height="10" rx="2" fill="var(--sw-blue)"/>
    <rect x="44" y="72" width="150" height="6" rx="2" fill="var(--sw-inkdark)" fill-opacity="0.22"/>
    <rect x="44" y="88" width="118" height="6" rx="2" fill="var(--sw-inkdark)" fill-opacity="0.22"/>
    <circle class="scale4" cx="200" cy="100" r="15" fill="var(--sw-blue)"/>
  </g>
  <rect class="frame" x="336" y="176" width="264" height="152"/>
  <text class="slug" x="336" y="354">flat-material</text>

  <g transform="translate(624,176)" data-bg="sw-metal">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-metal)"/>
    <rect x="20" y="22" width="224" height="108" fill="url(#skeu)"/>
    <rect x="20" y="22" width="224" height="108" fill="none" stroke="var(--sw-white)" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="36" y="44" width="122" height="32" fill="var(--sw-inkdark)" fill-opacity="0.6"/>
    <rect x="36" y="44" width="122" height="32" fill="none" stroke="var(--sw-white)" stroke-width="1" stroke-opacity="0.18"/>
    <circle class="pulse6" cx="206" cy="60" r="13" fill="var(--sw-amber)"/>
    <rect x="36" y="92" width="172" height="8" fill="var(--sw-inkdark)" fill-opacity="0.4"/>
  </g>
  <rect class="frame" x="624" y="176" width="264" height="152"/>
  <text class="slug" x="624" y="354">skeuomorphic</text>

  <g transform="translate(912,176)" data-bg="sw-soft">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-soft)"/>
    <rect x="50" y="46" width="168" height="70" rx="22" fill="var(--sw-softshade)"/>
    <rect class="press6" x="38" y="34" width="168" height="70" rx="22" fill="var(--sw-white)"/>
    <rect x="44" y="40" width="168" height="70" rx="22" fill="var(--sw-soft)"/>
    <rect x="70" y="66" width="88" height="8" rx="4" fill="var(--sw-inkdark)" fill-opacity="0.42"/>
    <circle cx="184" cy="70" r="12" fill="var(--sw-softshade)"/>
  </g>
  <rect class="frame" x="912" y="176" width="264" height="152"/>
  <text class="slug" x="912" y="354">neumorphism</text>

  <!-- row 2 -->
  <g transform="translate(48,386)" data-bg="sw-white">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-white)"/>
    <rect x="30" y="36" width="122" height="84" rx="32" fill="var(--sw-lilac)"/>
    <rect x="46" y="52" width="88" height="26" rx="13" fill="var(--sw-white)" fill-opacity="0.5"/>
    <circle class="bob4" cx="198" cy="78" r="36" fill="var(--sw-pink)"/>
    <ellipse cx="190" cy="62" rx="16" ry="9" fill="var(--sw-white)" fill-opacity="0.45"/>
  </g>
  <rect class="frame" x="48" y="386" width="264" height="152"/>
  <text class="slug" x="48" y="564">claymorphism</text>

  <g transform="translate(336,386)" data-bg="sw-termbg">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-termbg)"/>
    <g clip-path="url(#tileclip)"><g class="drift12" filter="url(#gblur)">
      <circle cx="72" cy="48" r="50" fill="var(--sw-violet)"/>
      <circle cx="198" cy="112" r="56" fill="var(--sw-cyan)"/>
    </g></g>
    <rect x="32" y="44" width="200" height="66" rx="14" fill="var(--sw-white)" fill-opacity="0.16"/>
    <rect x="32" y="44" width="200" height="66" rx="14" fill="none" stroke="var(--sw-white)" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="52" y="66" width="92" height="8" rx="4" fill="var(--sw-white)" fill-opacity="0.85"/>
    <rect x="52" y="84" width="60" height="6" rx="3" fill="var(--sw-white)" fill-opacity="0.55"/>
  </g>
  <rect class="frame" x="336" y="386" width="264" height="152"/>
  <text class="slug" x="336" y="564">glassmorphism</text>

  <g transform="translate(624,386)" data-bg="sw-yellow">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-yellow)"/>
    <rect x="42" y="48" width="142" height="68" fill="var(--sw-black)"/>
    <rect class="nudge3" x="34" y="40" width="142" height="68" fill="var(--sw-orange)"
          stroke="var(--sw-black)" stroke-width="4"/>
    <rect x="200" y="40" width="36" height="68" fill="var(--sw-black)"/>
    <rect x="34" y="124" width="202" height="6" fill="var(--sw-black)"/>
  </g>
  <rect class="frame" x="624" y="386" width="264" height="152"/>
  <text class="slug" x="624" y="564">neo-brutalist</text>

  <g transform="translate(912,386)" data-bg="sw-cream">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-cream)"/>
    <line class="draw6" x1="26" y1="30" x2="238" y2="30" stroke="var(--sw-rust)" stroke-width="3"/>
    <text x="26" y="74" fill="var(--sw-inkdark)" font-family="Georgia, 'Iowan Old Style', serif"
          font-size="27" font-weight="700">Editorial</text>
    <rect x="26" y="94" width="184" height="3" fill="var(--sw-inkdark)" fill-opacity="0.3"/>
    <rect x="26" y="108" width="152" height="3" fill="var(--sw-inkdark)" fill-opacity="0.3"/>
    <rect x="26" y="122" width="168" height="3" fill="var(--sw-inkdark)" fill-opacity="0.3"/>
  </g>
  <rect class="frame" x="912" y="386" width="264" height="152"/>
  <text class="slug" x="912" y="564">editorial</text>

  <!-- row 3 -->
  <g transform="translate(48,596)" data-bg="sw-indigoviolet">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-indigoviolet)"/>
    <rect x="132" y="16" width="110" height="46" fill="var(--sw-magenta)"/>
    <circle class="spin6" cx="62" cy="44" r="30" fill="var(--sw-teal)"/>
    <text x="22" y="106" fill="var(--sw-white)" font-size="26" font-weight="900"
          letter-spacing="-1">MORE</text>
    <rect x="22" y="118" width="212" height="14" fill="var(--sw-yellow)"/>
    <circle cx="214" cy="92" r="16" fill="var(--sw-teal)"/>
  </g>
  <rect class="frame" x="48" y="596" width="264" height="152"/>
  <text class="slug" x="48" y="774">maximalist</text>

  <g transform="translate(336,596)" data-bg="sw-termbg">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-termbg)"/>
    <rect x="26" y="46" width="212" height="56" rx="28" fill="url(#chrome)"/>
    <g clip-path="url(#y2kclip)">
      <rect class="sweep6" x="-46" y="46" width="34" height="56" fill="var(--sw-white)" fill-opacity="0.55"/>
    </g>
    <text x="28" y="130" fill="var(--sw-hotpink)" font-size="19" font-weight="700"
          letter-spacing="3.5">FUTURE</text>
  </g>
  <rect class="frame" x="336" y="596" width="264" height="152"/>
  <text class="slug" x="336" y="774">y2k-retrofuturist</text>

  <g transform="translate(624,596)" data-bg="sw-termbg">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-termbg)"/>
    <text x="20" y="42" fill="var(--sw-termgreen)"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">$ svg_check</text>
    <text x="20" y="72" fill="var(--sw-white)"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">0 errors</text>
    <rect class="blink2" x="20" y="92" width="11" height="20" fill="var(--sw-white)"/>
    <rect x="20" y="126" width="216" height="8" fill="var(--sw-termgreen)" fill-opacity="0.3"/>
    <rect x="20" y="126" width="150" height="8" fill="var(--sw-termgreen)"/>
  </g>
  <rect class="frame" x="624" y="596" width="264" height="152"/>
  <text class="slug" x="624" y="774">terminal-minimalist</text>

  <g transform="translate(912,596)" data-bg="background">
    <rect x="0" y="0" width="264" height="152" fill="var(--background)"/>
    <rect x="0" y="0" width="264" height="152" fill="url(#grid)"/>
    <rect x="40" y="34" width="118" height="66" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
    <rect class="draw6" x="40" y="34" width="118" height="66" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    <line x1="168" y1="34" x2="238" y2="34" stroke="var(--dim)" stroke-width="0.8" stroke-dasharray="6 5"/>
    <line x1="40" y1="120" x2="158" y2="120" stroke="var(--dim)" stroke-width="0.8"
          marker-start="url(#tip)" marker-end="url(#tip)"/>
    <text x="176" y="64" fill="var(--dim)"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">118</text>
  </g>
  <rect class="frame" x="912" y="596" width="264" height="152"/>
  <text class="slug" x="912" y="774">blueprint</text>

  <!-- row 4 -->
  <g transform="translate(48,806)" data-bg="sw-offwhite">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-offwhite)"/>
    <rect x="22" y="30" width="74" height="40" fill="var(--sw-white)" stroke="var(--sw-inkdark)" stroke-width="2"/>
    <rect x="168" y="86" width="74" height="40" fill="var(--sw-white)" stroke="var(--sw-inkdark)" stroke-width="2"/>
    <path id="netTile" d="M96,50 H132 V106 H168" fill="none" stroke="var(--sw-blue2)" stroke-width="1.5"/>
    <circle cx="132" cy="50" r="3.5" fill="var(--sw-blue2)"/>
    <circle class="tok" r="5">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#netTile"/></animateMotion>
    </circle>
  </g>
  <rect class="frame" x="48" y="806" width="264" height="152"/>
  <text class="slug" x="48" y="984">schematic</text>

  <g transform="translate(336,806)" data-bg="sw-lightgray">
    <rect x="0" y="0" width="264" height="152" fill="var(--sw-lightgray)"/>
    <rect x="18" y="20" width="130" height="54" rx="10" fill="var(--sw-white)"
          stroke="var(--sw-inkdark)" stroke-width="1" stroke-opacity="0.16"/>
    <rect x="158" y="20" width="88" height="54" rx="10" fill="var(--sw-indigo)"/>
    <rect x="18" y="84" width="88" height="50" rx="10" fill="var(--sw-white)"
          stroke="var(--sw-inkdark)" stroke-width="1" stroke-opacity="0.16"/>
    <rect x="116" y="84" width="130" height="50" rx="10" fill="var(--sw-white)"
          stroke="var(--sw-inkdark)" stroke-width="1" stroke-opacity="0.16"/>
    <rect x="36" y="38" width="66" height="8" rx="4" fill="var(--sw-inkdark)" fill-opacity="0.3"/>
    <rect x="134" y="104" width="88" height="8" rx="4" fill="var(--sw-inkdark)" fill-opacity="0.3"/>
    <circle class="pulse3" cx="46" cy="109" r="9" fill="var(--sw-indigo)"/>
  </g>
  <rect class="frame" x="336" y="806" width="264" height="152"/>
  <text class="slug" x="336" y="984">bento-grid</text>

  <!-- note panel, spanning the last two cells -->
  <rect class="panel" x="624" y="806" width="552" height="152" data-bg="surface"/>
  <text class="stn"  x="648" y="848" data-bg="surface">--style &lt;slug&gt;</text>
  <text class="mono" x="648" y="884" data-bg="surface">style owns form: shape, material, motion</text>
  <text class="mono" x="648" y="912" data-bg="surface">brand tokens still own the palette</text>
  <text class="mono" x="648" y="940" data-bg="surface">reference/styles.md — one file each</text>

  <line class="thin" x1="920" y1="1014" x2="1176" y2="1014"/>
  <text class="block" x="920" y="1040" data-role="metadata">SHEET 3 · STYLE CATALOG</text>
</svg>
