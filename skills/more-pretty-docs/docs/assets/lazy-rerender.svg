<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"
     role="img" data-loop-s="12" data-bg="background">
  <title>How a re-author is decided</title>
  <desc>A board of seven cells. The focal cell holds the verdict: when all three stored
hashes still match, the visual is reused and no file is written. Three cells name the
hashes that are compared — the facts the visual depicts, the committed svg itself, and
the design system — and a status dot visits them one at a time. The last row states both
outcomes: if any one hash moved, that visual alone is re-authored and commits fresh
hashes; a prose-only edit moves no hash and re-authors nothing.</desc>

  <style>
    svg { --background:#12324f; --surface:#17405f; --ink:#e8f2fb;
          --dim:#9fc4e8; --accent:#e0a33e; --warn:#e2725b; }

    .bg    { fill: var(--background); }
    .cell  { fill: var(--surface); stroke: var(--dim); stroke-width: 1; }
    .focal { fill: var(--accent); stroke: none; }
    .flag  { fill: var(--warn); }

    .h     { fill: var(--ink); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 44px; font-weight: 700; letter-spacing: -0.5px; }
    .lede  { fill: var(--dim); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 23px; font-weight: 600; }
    .lab   { fill: var(--dim); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 23px; font-weight: 600; }
    .lab-f { fill: var(--background); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 23px; font-weight: 600; }
    .val   { fill: var(--ink); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 40px; font-weight: 700; }
    .val-m { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 30px; font-weight: 700; }
    .val-f { fill: var(--background); font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
             font-size: 52px; font-weight: 700; }

    /* motion — one status pulse visiting one cell at a time.
       6s divides the 12s loop twice; negative delays add no time. */
    .dot { fill: var(--accent); animation: live 6s ease-in-out infinite; }
    .n1  { animation-delay: 0s; }
    .n2  { animation-delay: -2s; }
    .n3  { animation-delay: -4s; }
    @keyframes live { 0%, 66%, 100% { opacity: .2 } 12%, 33% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; opacity: 1; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>

  <!-- row 1 — col 0 span 3: the subject -->
  <rect class="cell" x="40" y="40" width="550" height="140" rx="16" data-bg="surface"/>
  <text class="h"    x="72" y="106" data-role="title" data-bg="surface">lazy re-author</text>
  <text class="lede" x="72" y="146" data-bg="surface">one hash moves — one re-author</text>

  <!-- row 1 — col 3 span 3: the focal cell, the verdict -->
  <rect class="focal" x="610" y="40" width="550" height="140" rx="16" data-bg="accent-primary"/>
  <text class="lab-f" x="642" y="86"  data-bg="accent-primary">All three still match</text>
  <text class="val-f" x="642" y="152" data-bg="accent-primary">reuse</text>

  <!-- row 2 — the three compared hashes -->
  <rect class="cell" x="40" y="200" width="360" height="130" rx="16" data-bg="surface"/>
  <text class="lab"   x="72" y="246" data-bg="surface">The facts it depicts</text>
  <text class="val-m" x="72" y="300" data-bg="surface">facts_hash</text>
  <circle class="dot n1" cx="368" cy="238" r="9"/>

  <rect class="cell" x="420" y="200" width="360" height="130" rx="16" data-bg="surface"/>
  <text class="lab"   x="452" y="246" data-bg="surface">The committed .svg</text>
  <text class="val-m" x="452" y="300" data-bg="surface">src_hash</text>
  <circle class="dot n2" cx="748" cy="238" r="9"/>

  <rect class="cell" x="800" y="200" width="360" height="130" rx="16" data-bg="surface"/>
  <text class="lab"   x="832" y="246" data-bg="surface">The design system</text>
  <text class="val-m" x="832" y="300" data-bg="surface">design_hash</text>
  <circle class="dot n3" cx="1128" cy="238" r="9"/>

  <!-- row 3 — col 0 span 4: the moved-hash outcome, flagged in warn -->
  <rect class="cell" x="40" y="350" width="740" height="130" rx="16" data-bg="surface"/>
  <rect class="flag" x="732" y="382" width="16" height="16" rx="5"/>
  <text class="lab" x="72" y="396" data-bg="surface">Any one of them moved</text>
  <text class="val" x="72" y="450" data-bg="surface">re-author that one visual</text>

  <!-- row 3 — col 4 span 2: the prose-only outcome -->
  <rect class="cell" x="800" y="350" width="360" height="130" rx="16" data-bg="surface"/>
  <text class="lab" x="832" y="396" data-bg="surface">A prose-only edit</text>
  <text class="val" x="832" y="450" data-bg="surface">0 re-authors</text>
</svg>
