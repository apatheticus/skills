<line class="nb-r" x1="750" y1="261" x2="820" y2="261" stroke-width="6"/>
<rect class="nb-pk" x="384" y="249" width="16" height="16"/>
<rect x="80" y="392" width="1040" height="44" fill="var(--ink)"/>
<g data-bg="var(--ink)"><text class="nb-f" data-role="metadata" x="96" y="420" fill="var(--accent)">INGEST -> MAP -> PERSIST</text>
<text class="nb-f" data-role="metadata" x="1104" y="420" text-anchor="end" fill="var(--accent)">R.01</text></g>
</svg>
