<rect x="148" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="174" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="460" y="190" width="300" height="150" fill="var(--shadow)"/>
<rect x="450" y="180" width="300" height="150" fill="var(--surface)"/>
<rect x="450" y="180" width="300" height="150" class="nb-b"/>
<rect x="450" y="180" width="300" height="34" fill="var(--accent2)"/>
<line class="nb-r" x1="450" y1="214" x2="750" y2="214"/>
