<rect x="836" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="862" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="888" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="914" y="304" width="16" height="12" fill="var(--ink)"/>
<g data-bg="var(--surface)">
  <text class="nb-t" x="230" y="258" text-anchor="middle">Source</text>
