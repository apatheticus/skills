<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="12" data-bg="var(--ground)" data-specimen="true">
<title>Neo-brutalist — Source, Transform, Store</title>
<desc>Heavy black rules, hard offset shadow blocks and flat yellow, cyan and red panels on bone white. A red block steps along the connector in five discrete jumps.</desc>
<defs>

</defs>
<style>
svg { --ground:#F2F0E6; --ink:#101010; --surface:#FFFFFF; --accent:#FFE500; --accent2:#00C2FF; --accent3:#FF4D3D; --shadow:#101010; }
  .nb-h { font: 900 58px "Archivo Black", Impact, sans-serif; fill: var(--ink); letter-spacing: -1px; }
  .nb-k { font: 700 19px "Courier New", monospace; fill: var(--ink); letter-spacing: 2px; }
  .nb-t { font: 900 26px "Archivo Black", Impact, sans-serif; fill: var(--ink); }
  .nb-s { font: 400 19px "Courier New", monospace; fill: var(--ink); }
  .nb-f { font: 700 16px "Courier New", monospace; fill: var(--ink); letter-spacing: 1px; }
  .nb-b { fill: none; stroke: var(--ink); stroke-width: 4; }
  .nb-r { stroke: var(--ink); stroke-width: 3; }
  .nb-pk { fill: var(--accent3); animation: nb-pk 6s steps(5, end) infinite; }
  @keyframes nb-pk { 0% { transform: translateX(0) } 100% { transform: translateX(370px) } }
  @media (prefers-reduced-motion: reduce) { .nb-pk { animation: none; opacity: 0 } }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<rect x="80" y="26" width="640" height="52" fill="var(--accent)"/>
<rect x="80" y="26" width="640" height="52" class="nb-b"/>
<text class="nb-h" x="96" y="70">DATA/FLOW</text>
<rect x="740" y="26" width="380" height="52" fill="var(--accent2)"/>
<rect x="740" y="26" width="380" height="52" class="nb-b"/>
<text class="nb-k" x="756" y="59">NO GRADIENTS. NO MERCY.</text>
<line class="nb-r" x1="80" y1="104" x2="1120" y2="104" stroke-width="6"/>
<rect x="90" y="190" width="300" height="150" fill="var(--shadow)"/>
<rect x="80" y="180" width="300" height="150" fill="var(--surface)"/>
<rect x="80" y="180" width="300" height="150" class="nb-b"/>
<rect x="80" y="180" width="300" height="34" fill="var(--accent)"/>
