<rect x="466" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="492" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="518" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="544" y="304" width="16" height="12" fill="var(--ink)"/>
<rect x="830" y="190" width="300" height="150" fill="var(--shadow)"/>
<rect x="820" y="180" width="300" height="150" fill="var(--surface)"/>
<rect x="820" y="180" width="300" height="150" class="nb-b"/>
<rect x="820" y="180" width="300" height="34" fill="var(--accent3)"/>
<line class="nb-r" x1="820" y1="214" x2="1120" y2="214"/>
