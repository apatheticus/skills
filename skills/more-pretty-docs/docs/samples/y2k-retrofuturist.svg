<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="12" data-bg="var(--ground)" data-specimen="true">
<title>Y2K retrofuturist — Source, Transform, Store</title>
<desc>Chrome pills with a hard light band and a dark break at the base, iridescent edges and a perspective floor. Type sits on solid inner pills, never on the chrome ramp.</desc>
<defs>
  <linearGradient id="y2-chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--chromelt)"/>
    <stop offset="0.34" stop-color="var(--chromemid)"/>
    <stop offset="0.40" stop-color="var(--chromehi)"/>
    <stop offset="0.62" stop-color="var(--chromelo)"/>
    <stop offset="1" stop-color="var(--chromedk)"/>
  </linearGradient>
  <linearGradient id="y2-irid" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="var(--cy)"/>
    <stop offset="0.5" stop-color="var(--violet)"/>
    <stop offset="1" stop-color="var(--hot)"/>
  </linearGradient>
  <linearGradient id="y2-scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="var(--cy)" stop-opacity="0"/>
    <stop offset="0.5" stop-color="var(--cy)" stop-opacity=".2"/>
    <stop offset="1" stop-color="var(--cy)" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
svg { --ground:#070B18; --ink:#EAF2FF; --muted:#B9C7E8; --chromelt:#DFE9F5; --chromemid:#8FA6C4; --chromehi:#FFFFFF; --chromelo:#5B7196; --chromedk:#2B3A52; --hot:#FF3FB4; --cy:#4BF0FF; --violet:#7B2FFF; --pill:#141B33; --grid:#243156; }
  .y2-h { font: 700 44px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 4px; }
  .y2-t { font: 700 25px "Helvetica Neue", Arial, sans-serif; fill: var(--ink); letter-spacing: 3px; }
  .y2-s { font: 400 19px ui-monospace, Menlo, monospace; fill: var(--muted); }
  .y2-f { font: 400 18px ui-monospace, Menlo, monospace; fill: var(--muted); letter-spacing: 2px; }
  .y2-e { fill: none; stroke: url(#y2-irid); stroke-width: 2; }
  .y2-g { stroke: var(--grid); stroke-width: 1; }
  /* one pass per 12s: 0.083 Hz, far below the 3 Hz ceiling */
  .y2-band { animation: y2-band 12s linear infinite; }
  @keyframes y2-band { from { transform: translateY(-140px) } to { transform: translateY(500px) } }
  .y2-glint { animation: y2-glint 6s ease-in-out infinite; }
  @keyframes y2-glint { 0% { transform: translateX(-120px) } 100% { transform: translateX(420px) } }
  @media (prefers-reduced-motion: reduce) { .y2-band, .y2-glint { animation: none; opacity: 0 } }
</style>
