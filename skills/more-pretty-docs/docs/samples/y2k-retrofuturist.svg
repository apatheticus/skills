<g data-bg="var(--pill)">
  <text class="y2-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="y2-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--pill)">
