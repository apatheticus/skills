<g data-bg="var(--ground)">
  <text class="sm-t" x="230" y="258" text-anchor="middle">Source</text>
  <text class="sm-s" x="230" y="288" text-anchor="middle">event stream</text>
</g>
<g data-bg="var(--ground)">
  <text class="sm-t" x="600" y="258" text-anchor="middle">Transform</text>
  <text class="sm-s" x="600" y="288" text-anchor="middle">map, filter</text>
</g>
<g data-bg="var(--ground)">
  <text class="sm-t" x="970" y="258" text-anchor="middle">Store</text>
  <text class="sm-s" x="970" y="288" text-anchor="middle">warehouse</text>
</g>
