<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" data-loop-s="12" data-bg="var(--ground)" data-specimen="true">
<title>Swiss minimal — Source, Transform, Store</title>
<desc>Three outlined boxes on a warm white grid with a red accent bar, uppercase kicker, large tight-set title and a measured baseline rule. A red dot runs the connector.</desc>
<defs>

</defs>
<style>
svg { --ground:#F4F4F2; --ink:#111111; --muted:#6E6E6E; --rule:#C9C9C6; --accent:#D62828; --surface:#FFFFFF; }
  .sm-k { font: 500 18px Helvetica, Arial, sans-serif; fill: var(--muted); letter-spacing: 2.4px; text-transform: uppercase; }
  .sm-h { font: 700 56px Helvetica, Arial, sans-serif; fill: var(--ink); letter-spacing: -1.4px; }
  .sm-t { font: 700 24px Helvetica, Arial, sans-serif; fill: var(--ink); letter-spacing: .2px; }
  .sm-s { font: 400 19px Helvetica, Arial, sans-serif; fill: var(--muted); }
  .sm-f { font: 400 16px Helvetica, Arial, sans-serif; fill: var(--muted); letter-spacing: 1.2px; }
  .sm-r { stroke: var(--rule); stroke-width: 1; }
  .sm-link { stroke: var(--ink); stroke-width: 2; }
  .sm-b { fill: none; stroke: var(--ink); stroke-width: 1; }
  .sm-dot { fill: var(--accent); animation: sm-run 6s linear infinite; }
  @keyframes sm-run { 0% { transform: translateX(0) } 100% { transform: translateX(370px) } }
  @media (prefers-reduced-motion: reduce) { .sm-dot { animation: none; opacity: 0 } }
</style>
<rect x="0" y="0" width="1200" height="460" fill="var(--ground)"/>
<line class="sm-r" x1="80" y1="60" x2="1120" y2="60"/>
<text class="sm-k" x="80" y="46">Catalogue — 03</text>
<text class="sm-h" x="80" y="126">Datenfluss</text>
<text class="sm-s" x="80" y="156">Quelle, Umformung, Speicher</text>
<rect x="1046" y="26" width="74" height="26" fill="var(--accent)"/>
<line class="sm-r" x1="80" y1="60" x2="80" y2="72"/>
