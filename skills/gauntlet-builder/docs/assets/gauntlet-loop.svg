<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880"
     width="1200" height="880" role="img" data-loop-s="12" data-bg="background"
     data-diagram="flowchart">
  <title>The gauntlet loop</title>
  <desc>A flowchart. The lead writes a contract for one piece, a builder subagent produces the artifact and its evidence, and a fresh critic audits it blind against the answer key. The critic gets the answer key, the artifact and the evidence, never the builder's rationale or any prior critic's notes, and a new critic runs every retry. A win or a tie passes and the evidence is logged. A loss returns exactly one gap, which becomes the next contract. Nothing in the diagram counts rounds.</desc>
  <style>
    svg { --background:#0d1117; --surface:#161b22; --ink:#c9d1d9; --muted:#8b949e;
          --rule:#30363d; --ok:#3fb950; --warn:#d29922; --err:#f85149; --id:#58a6ff; }

    .bg    { fill: var(--background); }
    .mask  { fill: var(--background); }
    .box   { fill: var(--surface); stroke: var(--muted); stroke-width: 1.25; }
    .focus { fill: var(--surface); stroke: var(--id); stroke-width: 2; }
    .pass  { fill: var(--ok); }
    .gapbx { fill: var(--surface); stroke: var(--warn); stroke-width: 1.5; }
    .dia   { fill: var(--surface); stroke: var(--muted); stroke-width: 1.25; }

    .edge  { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .plate { fill: var(--background); }
    .hair  { stroke: var(--rule); stroke-width: 1; fill: none; }
    .head  { fill: var(--muted); }
    .swat  { fill: var(--id); }

    .t     { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace,
                          SFMono-Regular, Menlo, Consolas, monospace; }
    .ink   { fill: var(--ink); }
    .mut   { fill: var(--muted); }
    .ok    { fill: var(--ok); }
    .warn  { fill: var(--warn); }
    .err   { fill: var(--err); }
    .id    { fill: var(--id); }
    .ko    { fill: var(--background); }
    .b     { font-weight: 700; }

    /* one station of the chain is current at a time, in traversal order */
    .rail   { fill: var(--muted); }
    .rail-a { animation: active 12s steps(1, end) infinite; }
    @keyframes active {
      0%,   32.9% { fill: var(--ok) }
      33%,  100%  { fill: var(--muted) }
    }
    .r1 { animation-delay:  0s }
    .r2 { animation-delay: -8s }
    .r3 { animation-delay: -4s }

    /* the one gap travelling back to become the next contract. The dash pattern is
       the resting state, so the return route stays visible when nothing is moving. */
    .return { stroke-dasharray: 8 8; animation: back 6s steps(4, end) infinite; }
    @keyframes back {
      from { stroke-dashoffset: 16 }
      to   { stroke-dashoffset: 0 }
    }

    @media (prefers-reduced-motion: reduce) {
      .rail-a { animation: none; fill: var(--muted) }
      .return { animation: none; stroke-dashoffset: 0 }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="880"/>

  <!-- connectors -->
  <path class="edge" data-edge="true" d="M 440,160 V 224" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="true" d="M 440,304 V 368" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="true" d="M 440,448 V 512" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="true" d="M 520,572 H 720" marker-end="url(#arrow)"/>
  <path class="edge" data-edge="true" d="M 440,632 V 696" marker-end="url(#arrow)"/>
  <path class="edge return" data-edge="true" d="M 320,736 H 200 V 120 H 320"
        marker-end="url(#arrow)"/>

  <!-- connector labels -->
  <rect class="plate" data-label="true" x="564" y="540" width="112" height="22"/>
  <text class="t mut" x="620" y="556" font-size="16" text-anchor="middle"
        data-role="metadata">WIN &#183; TIE</text>

  <rect class="plate" data-label="true" x="452" y="642" width="96" height="22"/>
  <text class="t mut" x="500" y="658" font-size="16" text-anchor="middle"
        data-role="metadata">LOSS</text>

  <!-- what crosses into the audit, and what does not -->
  <text class="t ok b"  x="624" y="380" font-size="20" data-role="essential">gets</text>
  <text class="t ink"   x="712" y="380" font-size="20" data-role="essential">answer key, artifact, evidence</text>
  <text class="t err b" x="624" y="408" font-size="20" data-role="essential">never</text>
  <text class="t ink"   x="712" y="408" font-size="20" data-role="essential">builder rationale, prior notes</text>
  <text class="t id b"  x="624" y="436" font-size="20" data-role="essential">fresh</text>
  <text class="t ink"   x="712" y="436" font-size="20" data-role="essential">a new critic every retry</text>

  <!-- nodes -->
  <g data-node="true" data-bg="surface">
    <rect class="mask" x="320" y="80" width="240" height="80"/>
    <rect class="box"  x="320" y="80" width="240" height="80"/>
    <rect class="rail rail-a r1" x="320" y="80" width="4" height="80"/>
    <text class="t ink b" x="440" y="116" font-size="20" text-anchor="middle">CONTRACT</text>
    <text class="t mut"   x="440" y="142" font-size="16" text-anchor="middle"
          data-role="metadata">lead writes one piece</text>
  </g>

  <g data-node="true" data-bg="surface">
    <rect class="mask" x="320" y="224" width="240" height="80"/>
    <rect class="box"  x="320" y="224" width="240" height="80"/>
    <rect class="rail rail-a r2" x="320" y="224" width="4" height="80"/>
    <text class="t ink b" x="440" y="260" font-size="20" text-anchor="middle">BUILD</text>
    <text class="t mut"   x="440" y="286" font-size="16" text-anchor="middle"
          data-role="metadata">builder subagent</text>
  </g>

  <g data-node="true" data-focal="true" data-bg="surface">
    <rect class="mask"  x="320" y="368" width="240" height="80"/>
    <rect class="focus" x="320" y="368" width="240" height="80"/>
    <rect class="rail rail-a r3" x="320" y="368" width="4" height="80"/>
    <text class="t ink b" x="440" y="404" font-size="20" text-anchor="middle">AUDIT</text>
    <text class="t id"    x="440" y="430" font-size="16" text-anchor="middle"
          data-role="metadata">fresh critic, blind</text>
  </g>

  <g data-node="true" data-bg="surface">
    <polygon class="dia" points="440,512 520,572 440,632 360,572"/>
    <text class="t ink b" x="440" y="580" font-size="20" text-anchor="middle">verdict?</text>
  </g>

  <g data-node="true" data-bg="ok">
    <rect class="mask" x="720" y="532" width="240" height="80"/>
    <rect class="pass" x="720" y="532" width="240" height="80"/>
    <text class="t ko b" x="840" y="568" font-size="20" text-anchor="middle">&#10003; PASSED</text>
    <text class="t ko"   x="840" y="594" font-size="16" text-anchor="middle"
          data-role="metadata">evidence logged</text>
  </g>

  <g data-node="true" data-bg="surface">
    <rect class="mask"  x="320" y="696" width="240" height="80"/>
    <rect class="gapbx" x="320" y="696" width="240" height="80"/>
    <text class="t warn b" x="440" y="732" font-size="20" text-anchor="middle">&#8800; ONE GAP</text>
    <text class="t mut"    x="440" y="758" font-size="16" text-anchor="middle"
          data-role="metadata">the only brief</text>
  </g>

  <!-- legend -->
  <g data-legend="true">
    <line class="hair" x1="80" y1="824" x2="1120" y2="824"/>
    <text class="t mut"  x="80"  y="848" font-size="16" data-role="metadata">LEGEND</text>
    <text class="t ok"   x="200" y="848" font-size="16" data-role="metadata">&#10003;</text>
    <text class="t mut"  x="224" y="848" font-size="16" data-role="metadata">win or tie &#8212; passed, logged</text>
    <text class="t warn" x="520" y="848" font-size="16" data-role="metadata">&#8800;</text>
    <text class="t mut"  x="544" y="848" font-size="16" data-role="metadata">loss &#8212; one gap, back to contract</text>
    <rect class="swat" x="920" y="836" width="4" height="16"/>
    <text class="t mut"  x="944" y="848" font-size="16" data-role="metadata">blind audit</text>
  </g>
</svg>
